      bus_locations: {
        base: {
          en: "When traveling by bus, locate the nearest {bus_stop} or a {bus_shelter} for protection from the elements. For longer journeys or transfers, head to a {bus_station_bus_terminal} or an {interchange_transit_center}.<br><br>Check the {timetable_schedule} for your desired {route_number} and {destination}. You might take a {local_bus} for short trips, an {express_bus} for faster travel with fewer stops, or a {shuttle_bus} for specific routes like airport transfers. For longer distances between cities, a {coach_intercity_bus} is ideal. If you're out late, a {night_bus} might be available.<br><br>",
          de: "Wenn Sie mit dem Bus reisen, suchen Sie die nächstgelegene {bus_stop} oder eine {bus_shelter} zum Schutz vor den Elementen. Für längere Reisen oder Transfers begeben Sie sich zu einer {bus_station_bus_terminal} oder einem {interchange_transit_center}.<br><br>Überprüfen Sie den {timetable_schedule} für Ihre gewünschte {route_number} und {destination}. Sie könnten einen {local_bus} für kurze Fahrten, einen {express_bus} für schnellere Reisen mit weniger Haltestellen oder einen {shuttle_bus} für bestimmte Routen wie Flughafentransfers nehmen. Für längere Strecken zwischen Städten ist ein {coach_intercity_bus} ideal. Wenn Sie spät unterwegs sind, könnte ein {night_bus} verfügbar sein.<br><br>",
          es: "Cuando viaje en autobús, localice la {bus_stop} más cercana o una {bus_shelter} para protegerse de los elementos. Para viajes más largos o traslados, diríjase a una {bus_station_bus_terminal} o a un {interchange_transit_center}.<br><br>Consulte el {timetable_schedule} para su {route_number} y {destination} deseados. Puede tomar un {local_bus} para viajes cortos, un {express_bus} para viajes más rápidos con menos paradas, o un {shuttle_bus} para rutas específicas como traslados al aeropuerto. Para distancias más largas entre ciudades, un {coach_intercity_bus} es ideal. Si sale tarde, podría haber un {night_bus} disponible.<br><br>",
          fr: "Lorsque vous voyagez en bus, localisez l'{bus_stop} la plus proche ou un {bus_shelter} pour vous protéger des éléments. Pour les trajets plus longs ou les transferts, rendez-vous à une {bus_station_bus_terminal} ou à un {interchange_transit_center}.<br><br>Vérifiez le {timetable_schedule} pour votre {route_number} et {destination} souhaités. Vous pouvez prendre un {local_bus} pour les trajets courts, un {express_bus} pour un voyage plus rapide avec moins d'arrêts, ou un {shuttle_bus} pour des itinéraires spécifiques comme les transferts aéroportuaires. Pour les longues distances entre les villes, un {coach_intercity_bus} est idéal. Si vous sortez tard, un {night_bus} pourrait être disponible.<br><br>",
          it: "Quando viaggi in autobus, individua la {bus_stop} più vicina o una {bus_shelter} per proteggerti dagli agenti atmosferici. Per viaggi più lunghi o trasferimenti, dirigiti verso una {bus_station_bus_terminal} o un {interchange_transit_center}.<br><br>Controlla il {timetable_schedule} per il tuo {route_number} e {destination} desiderati. Potresti prendere un {local_bus} per viaggi brevi, un {express_bus} per viaggi più veloci con meno fermate, o un {shuttle_bus} per percorsi specifici come i trasferimenti aeroportuali. Per distanze più lunghe tra le città, un {coach_intercity_bus} è ideale. Se esci tardi, potrebbe essere disponibile un {night_bus}.<br><br>",

      // --- Bus Tickets & Fares ---
      bus_tickets_fares: {
        base: {
          en: "To ride the bus, you'll need to pay the {fare} and obtain a {ticket}. You can purchase a {single_one_way} ticket for a single journey or a {return_round_trip} ticket for a round trip. For frequent travel, a {day_pass_travel_card} might be more economical.<br><br>Payment methods vary: some buses have a {fare_box} for cash, while others rely on a {ticket_machine} for purchases. Remember to {validate} your ticket if required. Many systems now accept {contactless} payments. If paying with cash, it's often helpful to have {exact_change}.<br><br>",
          de: "Um den Bus zu fahren, müssen Sie den {fare} bezahlen und ein {ticket} erhalten. Sie können ein {single_one_way} Ticket für eine einfache Fahrt oder ein {return_round_trip} Ticket für eine Hin- und Rückfahrt kaufen. Für häufige Reisen könnte eine {day_pass_travel_card} wirtschaftlicher sein.<br><br>Die Zahlungsmethoden variieren: Einige Busse haben eine {fare_box} für Bargeld, während andere auf einen {ticket_machine} für den Kauf angewiesen sind. Denken Sie daran, Ihr Ticket zu {validate}, wenn dies erforderlich ist. Viele Systeme akzeptieren jetzt {contactless} Zahlungen. Wenn Sie bar bezahlen, ist es oft hilfreich, {exact_change} zu haben.<br><br>",
          es: "Para viajar en autobús, necesitará pagar la {fare} y obtener un {ticket}. Puede comprar un billete de {single_one_way} para un solo viaje o un billete de {return_round_trip} para un viaje de ida y vuelta. Para viajes frecuentes, un {day_pass_travel_card} podría ser más económico.<br><br>Los métodos de pago varían: algunos autobuses tienen una {fare_box} para efectivo, mientras que otros dependen de una {ticket_machine} para las compras. Recuerde {validate} su billete si es necesario. Muchos sistemas ahora aceptan pagos {contactless}. Si paga en efectivo, a menudo es útil tener {exact_change}.<br><br>",
          fr: "Pour prendre le bus, vous devrez payer le {fare} et obtenir un {ticket}. Vous pouvez acheter un billet {single_one_way} pour un trajet simple ou un billet {return_round_trip} pour un aller-retour. Pour les voyages fréquents, un {day_pass_travel_card} peut être plus économique.<br><br>Les méthodes de paiement varient : certains bus disposent d'une {fare_box} pour l'argent liquide, tandis que d'autres utilisent une {ticket_machine} pour les achats. N'oubliez pas de {validate} votre billet si nécessaire. De nombreux systèmes acceptent désormais les paiements {contactless}. Si vous payez en espèces, il est souvent utile d'avoir la {exact_change}.<br><br>",
          it: "Per viaggiare in autobus, dovrai pagare la {fare} e ottenere un {ticket}. Puoi acquistare un biglietto {single_one_way} per un viaggio singolo o un biglietto {return_round_trip} per un viaggio di andata e ritorno. Per viaggi frequenti, un {day_pass_travel_card} potrebbe essere più economico.<br><br>I metodi di pagamento variano: alcuni autobus hanno una {fare_box} per contanti, mentre altri si affidano a una {ticket_machine} per gli acquisti. Ricorda di {validate} il tuo biglietto se necessario. Molti sistemi ora accettano pagamenti {contactless}. Se paghi in contanti, è spesso utile avere la {exact_change}.<br><br>",

      on_the_bus: {
        base: {
          en: "When your bus arrives, wait for passengers to {to_alight_to_get_off} before you {to_board_to_get_on}. Once inside, move down the {aisle} and find a seat, being mindful of {priority_seating} for those who need it.<br><br>Keep an eye on the {next_stop_display} to know when your stop is approaching. To signal your stop, press the {stop_request_button_bell}. The {driver} will then pull over at the next designated stop.<br><br>",
          de: "Wenn Ihr Bus ankommt, warten Sie, bis die Passagiere {to_alight_to_get_off} sind, bevor Sie {to_board_to_get_on}. Gehen Sie einmal drinnen den {aisle} entlang und suchen Sie sich einen Sitzplatz, wobei Sie auf {priority_seating} für diejenigen achten, die ihn benötigen.<br><br>Behalten Sie die {next_stop_display} im Auge, um zu wissen, wann Ihre Haltestelle naht. Um Ihre Haltestelle zu signalisieren, drücken Sie den {stop_request_button_bell}. Der {driver} wird dann an der nächsten vorgesehenen Haltestelle anhalten.<br><br>",
          es: "Cuando llegue su autobús, espere a que los pasajeros {to_alight_to_get_off} antes de {to_board_to_get_on}. Una vez dentro, avance por el {aisle} y busque un asiento, teniendo en cuenta los {priority_seating} para quienes lo necesiten.<br><br>Esté atento al {next_stop_display} para saber cuándo se acerca su parada. Para señalar su parada, presione el {stop_request_button_bell}. El {driver} se detendrá en la siguiente parada designada.<br><br>",
          fr: "Lorsque votre bus arrive, attendez que les passagers {to_alight_to_get_off} avant de {to_board_to_get_on}. Une fois à l'intérieur, avancez dans l'{aisle} et trouvez un siège, en tenant compte des {priority_seating} pour ceux qui en ont besoin.<br><br>Gardez un œil sur le {next_stop_display} pour savoir quand votre arrêt approche. Pour signaler votre arrêt, appuyez sur le {stop_request_button_bell}. Le {driver} s'arrêtera alors au prochain arrêt désigné.<br><br>",

      train_Station: {
        base: {
          en: "At the {train_station_union_station}, you'll find the {concourse} which leads to the {platform} where trains arrive and depart on the {track}. For tickets, visit the {ticket_office_ticket_counter} or use a {ticket_machine_kiosk}.<br><br>Check the {arrivals_board} and {departures_board} for train times and platform information. If you need assistance, an {information_desk} is usually available. For temporary storage, look for {left_luggage_luggage_lockers}.<br><br>Train types vary: a {local_train_commuter_train} serves urban areas, a {regional_train} connects nearby cities, and an {intercity_long_distance_train} covers greater distances. For speed, opt for a {high_speed_train}, or for overnight travel, a {sleeper_train_night_train}.<br><br>",
          de: "Am {train_station_union_station} finden Sie die {concourse}, die zum {platform} führt, wo Züge auf dem {track} ankommen und abfahren. Für Tickets besuchen Sie das {ticket_office_ticket_counter} oder nutzen Sie einen {ticket_machine_kiosk}.<br><br>Überprüfen Sie die {arrivals_board} und {departures_board} für Zugzeiten und Bahnsteiginformationen. Wenn Sie Hilfe benötigen, ist normalerweise ein {information_desk} verfügbar. Für die vorübergehende Aufbewahrung suchen Sie nach {left_luggage_luggage_lockers}.<br><br>Zugtypen variieren: Ein {local_train_commuter_train} bedient städtische Gebiete, ein {regional_train} verbindet nahegelegene Städte, und ein {intercity_long_distance_train} deckt größere Entfernungen ab. Für Geschwindigkeit entscheiden Sie sich für einen {high_speed_train}, oder für Nachtfahrten einen {sleeper_train_night_train}.<br><br>",
          es: "En la {train_station_union_station}, encontrará el {concourse} que conduce a la {platform} donde los trenes llegan y salen en la {track}. Para boletos, visite la {ticket_office_ticket_counter} o use una {ticket_machine_kiosk}.<br><br>Consulte el {arrivals_board} y el {departures_board} para conocer los horarios de los trenes y la información de las plataformas. Si necesita ayuda, generalmente hay un {information_desk} disponible. Para almacenamiento temporal, busque {left_luggage_luggage_lockers}.<br><br>Los tipos de tren varían: un {local_train_commuter_train} sirve a áreas urbanas, un {regional_train} conecta ciudades cercanas, y un {intercity_long_distance_train} cubre distancias mayores. Para mayor velocidad, opte por un {high_speed_train}, o para viajes nocturnos, un {sleeper_train_night_train}.<br><br>",
          fr: "À la {train_station_union_station}, vous trouverez le {concourse} qui mène à la {platform} où les trains arrivent et partent sur la {track}. Pour les billets, rendez-vous au {ticket_office_ticket_counter} ou utilisez une {ticket_machine_kiosk}.<br><br>Consultez le {arrivals_board} et le {departures_board} pour les horaires des trains et les informations sur les quais. Si vous avez besoin d'aide, un {information_desk} est généralement disponible. Pour le stockage temporaire, cherchez des {left_luggage_luggage_lockers}.<br><br>Les types de trains varient : un {local_train_commuter_train} dessert les zones urbaines, un {regional_train} relie les villes voisines, et un {intercity_long_distance_train} couvre de plus grandes distances. Pour la vitesse, optez pour un {high_speed_train}, ou pour les voyages de nuit, un {sleeper_train_night_train}.<br><br>",
          it: "Alla {train_station_union_station} troverai il {concourse} che conduce alla {platform} dove i treni arrivano e partono sul {track}. Per i biglietti, visita il {ticket_office_ticket_counter} o utilizza una {ticket_machine_kiosk}.<br><br>Controlla il {arrivals_board} e il {departures_board} per gli orari dei treni e le informazioni sulle piattaforme. Se hai bisogno di assistenza, di solito è disponibile un {information_desk}. Per lo stoccaggio temporaneo, cerca i {left_luggage_luggage_lockers}.<br><br>I tipi di treno variano: un {local_train_commuter_train} serve le aree urbane, un {regional_train} collega le città vicine e un {intercity_long_distance_train} copre distanze maggiori. Per la velocità, opta per un {high_speed_train}, o per i viaggi notturni, un {sleeper_train_night_train}.<br><br>",

      // --- On the Train ---
      on_the_train: {
        base: {
          en: 'When your train arrives, {to_board} the correct {carriage_car}. Find your {seat}, whether it\'s an {aisle_seat} or a {window_seat}, and place your bags on the {overhead_rack_luggage_rack}.<br><br>During the journey, you might visit the {dining_car} for a meal or the {buffet_car_snack_bar} for refreshments. Some trains offer a {quiet_carriage} for a more peaceful ride. Remember to {to_alight} at your destination. If your journey involves a {connecting_train_connection}, you\'ll need to {transfer_change} trains at an intermediate station.<br><br>',
          de: 'Wenn Ihr Zug ankommt, {to_board} Sie den richtigen {carriage_car}. Finden Sie Ihren {seat}, ob es ein {aisle_seat} oder ein {window_seat} ist, und legen Sie Ihre Taschen auf das {overhead_rack_luggage_rack}.<br><br>Während der Fahrt können Sie den {dining_car} für eine Mahlzeit oder den {buffet_car_snack_bar} für Erfrischungen besuchen. Einige Züge bieten einen {quiet_carriage} für eine ruhigere Fahrt. Denken Sie daran, an Ihrem Ziel auszusteigen. Wenn Ihre Reise einen {connecting_train_connection} beinhaltet, müssen Sie an einer Zwischenstation die Züge {transfer_change}.<br><br>',
          es: 'Cuando llegue su tren, {to_board} el {carriage_car} correcto. Encuentre su {seat}, ya sea un {aisle_seat} o un {window_seat}, y coloque sus bolsas en el {overhead_rack_luggage_rack}.<br><br>Durante el viaje, puede visitar el {dining_car} para una comida o el {buffet_car_snack_bar} para refrescos. Algunos trenes ofrecen un {quiet_carriage} para un viaje más tranquilo. Recuerde {to_alight} en su destino. Si su viaje implica una {connecting_train_connection}, deberá {transfer_change} de trenes en una estación intermedia.<br><br>',
          fr: 'Lorsque votre train arrive, {to_board} le bon {carriage_car}. Trouvez votre {seat}, qu\'il s\'agisse d\'un {aisle_seat} ou d\'un {window_seat}, et placez vos sacs sur le {overhead_rack_luggage_rack}.<br><br>Pendant le voyage, vous pouvez visiter le {dining_car} pour un repas ou le {buffet_car_snack_bar} pour des rafraîchissements. Certains trains offrent un {quiet_carriage} pour un trajet plus paisible. N\'oubliez pas de {to_alight} à votre destination. Si votre voyage implique une {connecting_train_connection}, vous devrez {transfer_change} de train dans une gare intermédiaire.<br><br>',

      restaurant: {
        base: {
          en: 'When planning to dine out, it\'s often wise {to_book_to_make_a_reservation}, especially for popular spots. If you haven\'t made a {reservation_booking}, you\'ll be a {walk_in}.<br><br>Consider the {cuisine} you\'re in the mood for and check the restaurant\'s {opening_hours}. Upon arrival, the {host_hostess} will greet you and ask, "{table_for_two_three_four}?" <br><br>You can choose to sit {indoors_outdoors}, perhaps in a {booth_table}. Once seated, you\'ll be presented with the {menu} and, if applicable, the {wine_list}.<br><br>',

      ordering_meal: {
        base: {
          en: 'When ordering, it\'s crucial to mention any {dietary_restrictions_allergies}, for example, "I have a nut allergy" or "I am a {vegetarian_vegan}." If you avoid certain grains, ask for {gluten_free} options.<br><br>For steak orders, the server will ask, "{how_would_you_like_your_steak_cooked}" You can choose from Rare, Medium-rare, Medium, Medium-well, or Well-done. Don\'t forget to ask for any {condiments} you\'d like.<br><br>When your food arrives, the server will often say, "{enjoy_your_meal}" A polite response if they check on you later is, "{everything_is_delicious_thank_you}"<br><br>',

              <button title="Play" class="ml-2 px-1 py-0.5 rounded bg-blue-600 hover:bg-blue-700 text-white play-vocab flex items-center" data-idx="${idx}">
                <svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' viewBox='0 0 24 24'><path fill='currentColor' d='M8 5v14l11-7z'/></svg>
                <span class="soundwave" style="display:none"><svg width="22" height="18" viewBox="0 0 22 18"><rect x="1" width="3" height="6" y="12"/><rect x="6" width="3" height="6" y="12"/><rect x="11" width="3" height="6" y="12"/><rect x="16" width="3" height="6" y="12"/></svg></span>
              </button>
            </span>
            <span class="text-slate-400">${word.native}</span>
          `;
        vocabList.appendChild(item);
      });

      // Add event listeners for vocab playback
      vocabList.querySelectorAll(".play-vocab").forEach((btn) => {
        const soundwave = btn.querySelector(".soundwave");
        btn.onclick = function () {
          const idx = btn.getAttribute("data-idx");
          const word = learnedWords[idx].target;
          togglePlayStop(btn, true);
          speakText(word, selectedTargetLang, soundwave, function () {
            togglePlayStop(btn, false);
          });
        };
      });
      // --- WEB SPEECH API ---
      function speakText(text, lang, soundwaveEl, onDone) {
        if (!window.speechSynthesis) return;
        const utter = new window.SpeechSynthesisUtterance(text);
        utter.lang = lang;
        window.speechSynthesis.cancel(); // Stop any current speech
        if (soundwaveEl) soundwaveEl.style.display = "inline-block";
        utter.onend = utter.onerror = function () {
          if (soundwaveEl) soundwaveEl.style.display = "none";
          if (typeof onDone === "function") onDone();
        };
        window.speechSynthesis.speak(utter);
      }

      // Toggle play/stop icon for button
      function togglePlayStop(btn, isPlaying) {
        const svg = btn.querySelector("svg");
        if (!svg) return;
        if (isPlaying) {
          // Change to stop icon
          svg.innerHTML =
            '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>';
        } else {
          // Change to play icon
          svg.innerHTML = '<path fill="currentColor" d="M8 5v14l11-7z"/>';
        }
      }
    }

    function initializeApp() {
      // New languageDisplayNames object to hold translated language names
      // This object now holds the *display names* of the languages themselves,
      // translated into each UI language.
      // This was moved outside initializeApp to be a global const.

      // Populate UI language select first
      populateSelect(uiLangSelect, languageDisplayNames, "en"); // Default UI to English

      // Add event listener for UI language change
      uiLangSelect.addEventListener("change", () =>
        updateUIText(uiLangSelect.value)
      );

      // Populate other selects (topic names will now use the selected UI language)
  populateSelect(topicSelect, topicNames, "booking_flight");
      populateSelect(nativeLangSelect, languageDisplayNames, "en");
      populateSelect(targetLangSelect, languageDisplayNames, "de");

      // Add event listeners for topic, native, and target language changes
  topicSelect.addEventListener("change", generateText);
      nativeLangSelect.addEventListener("change", generateText);
      targetLangSelect.addEventListener("change", generateText);

      // Initial generation and UI text update
      updateUIText(uiLangSelect.value); // Apply initial UI language
      generateText(); // Generate content based on initial selections
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Populate the choose dropdown on load
      populateSelect(chooseOption, languageDisplayNames, chooseOption.value);
      // Add event listener to update UI language when changed
      chooseOption.addEventListener('change', function () {
        updateUIText(chooseOption.value);
      });
      initializeApp();
        // Hide/show menu logic
        const menuBox = document.getElementById("menuBox");
        const toggleMenuBtn = document.getElementById("menuButton");
        let menuVisible = true;
        toggleMenuBtn.onclick = function () {
          menuVisible = !menuVisible;
          menuBox.style.display = menuVisible ? "" : "none";
          toggleMenuBtn.textContent = menuVisible ? "_" : "_";
        };
    });
    // --- Menu toggle logic ---
    document.addEventListener('DOMContentLoaded', function () {
      const menuButton = document.getElementById('menuButton');
      const menuBox = document.getElementById('menuBox');
      menuButton.addEventListener('click', function () {
        if (menuBox.style.display === 'none') {
          menuBox.style.display = '';
        } else {
          menuBox.style.display = 'none';
        }
      });
    });
  </script>

</body>

</html>
