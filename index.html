<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktive Sprach-Lern App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .controls-card {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .soundwave {
        display: inline-block;
        vertical-align: middle;
        margin-left: 4px;
        width: 22px;
        height: 18px;
      }
      .soundwave rect {
        fill: #38bdf8;
        opacity: 0.7;
        animation: wave 1s infinite linear;
      }
      .soundwave rect:nth-child(2) { animation-delay: 0.2s; }
      .soundwave rect:nth-child(3) { animation-delay: 0.4s; }
      .soundwave rect:nth-child(4) { animation-delay: 0.6s; }
      .soundwave rect:nth-child(5) { animation-delay: 0.8s; }
      @keyframes wave {
        0%, 100% { height: 6px; y: 12px; }
        50% { height: 18px; y: 0px; }
      }
    </style>
  </head>
  <body class="bg-slate-900 text-white antialiased">
    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 md:py-12">
      <!-- Header -->
      <header class="text-center mb-4 md:mb-12">
        <h1
          class="text-4xl md:text-5xl font-bold text-white mb-2"
          data-key="appTitle"
        >
          Trovl
        </h1>
        <p class="text-lg md:text-xl text-slate-400" data-key="appSubtitle">
          Lerne neue Vokabeln direkt im Kontext.
        </p>
      </header>

      <!-- Hide Menu Button -->
      <div class="flex justify-start mb-4">
        <button id="toggle-menu-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded shadow transition">᎒</button>
      </div>
      <!-- Controls Card -->
      <div
        id="controls-card"
        class="bg-slate-800/50 border border-slate-700 rounded-xl shadow-lg p-6 mb-8 md:mb-12 controls-card sticky top-4 z-10"
      >
        <div
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end"
        >
          <!-- UI Language Selection -->
          <div>
            <label
              for="ui-lang-select"
              class="block mb-2 text-sm font-medium text-slate-300"
              data-key="uiLanguageLabel"
              >Menu Sprache</label
            >
            <select
              id="ui-lang-select"
              class="bg-slate-700 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            >
              <!-- Options will be populated by JS -->
            </select>
          </div>
          <!-- Topic Selection -->
          <div>
            <label
              for="topic-select"
              class="block mb-2 text-sm font-medium text-slate-300"
              data-key="topicLabel"
              >Thema</label
            >
            <select
              id="topic-select"
              class="bg-slate-700 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            >
              <!-- Options will be populated by JS -->
            </select>
          </div>
          <!-- Native Language Selection -->
          <div>
            <label
              for="native-lang-select"
              class="block mb-2 text-sm font-medium text-slate-300"
              data-key="yourLanguageLabel"
              >Deine Sprache</label
            >
            <select
              id="native-lang-select"
              class="bg-slate-700 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            >
              <!-- Options will be populated by JS -->
            </select>
          </div>
          <!-- Target Language Selection -->
          <div>
            <label
              for="target-lang-select"
              class="block mb-2 text-sm font-medium text-slate-300"
              data-key="targetLanguageLabel"
              >Zielsprache</label
            >
            <select
              id="target-lang-select"
              class="bg-slate-700 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            >
              <!-- Options will be populated by JS -->
            </select>
          </div>
        </div>
        <p id="error-message" class="text-red-400 text-center mt-4 text-sm"></p>
      </div>

      <!-- Content Display -->
      <main id="content-display">
        <h2 id="topic-title" class="text-2xl font-bold text-center mb-6"></h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <!-- Left Column: Learning Text & Vocab List -->
          <div class="space-y-8">
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
              <h3
                class="text-xl font-semibold mb-3"
                data-key="learningTextTitle"
              >
                Lerntext
              </h3>
              <p
                id="learning-text"
                class="text-slate-300 leading-relaxed text-lg"
              ></p>
            </div>
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
              <h3 class="text-xl font-semibold mb-3" data-key="vocabListTitle">
                Vokabelliste
              </h3>
              <div id="vocab-list" class="space-y-2"></div>
            </div>
          </div>
          <!-- Right Column: Full Texts -->
          <div class="space-y-8">
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
              <h3
                id="native-lang-title"
                class="text-xl font-semibold mb-3"
              ></h3>
              <p
                id="native-lang-full-text"
                class="text-slate-300 leading-relaxed"
              ></p>
            </div>
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
              <h3
                id="target-lang-title"
                class="text-xl font-semibold mb-3"
              ></h3>
              <p
                id="target-lang-full-text"
                class="text-slate-300 leading-relaxed"
              ></p>
            </div>
          </div>
        </div>
      </main>
    </div>

            es: '"Este año", declaré, "¡finalmente voy a hacer un gran viaje!" Mis ojos escanearon el globo, soñando con aventuras. El primer paso, por supuesto, era elegir una {airline} o {carrier}. Quería una con buena reputación e, idealmente, una {airfare} razonable. No estaba buscando cualquier viaje; quería una aventura {international flight}. "Esta vez no voy a tomar un {domestic_flight}", murmuré, imaginando tierras lejanas. Abrí un sitio web de comparación, filtrando por {international_flights}. Los precios variaban enormemente. Algunas aerolíneas ofrecían ofertas tentadoras para un {one_way_ticket}, pero sabía que eventualmente necesitaría regresar, así que un {round_trip_ticket} era esencial. Encontré una gran oferta que incluía un {e_ticket}, lo cual era conveniente, ¡nada de papel que perder! Después de investigar un poco más y revisar las reseñas de mi {carrier} elegido, hice clic en "reservar" con confianza. La emoción burbujeó mientras imaginaba mi próximo viaje, sabiendo que había asegurado mi pasaje a un destino lejano.',

            it: '"Quest\'anno," ho dichiarato, "farò finalmente un grande viaggio!" I miei occhi hanno scrutato il globo, sognando l\'avventura. Il primo passo, ovviamente, è stato scegliere una {airline} o un {carrier}. Ne volevo una con una buona reputazione e, idealmente, una {airfare} ragionevole. Non stavo cercando un viaggio qualsiasi; volevo un\'avventura {international flight}. "Niente {domestic_flight} per me questa volta," ho mormorato, immaginando terre lontane. Ho aperto un sito web di confronto, filtrando per {international_flights}. I prezzi variavano enormemente. Alcune compagnie aeree offrivano offerte allettanti per un {one_way_ticket}, ma sapevo che alla fine avrei dovuto tornare, quindi un {round_trip_ticket} era essenziale. Ho trovato un\'ottima offerta che includeva un {e_ticket}, il che era comodo - niente carta da perdere! Dopo qualche ricerca in più e aver controllato le recensioni per il mio {carrier} scelto, ho cliccato su "prenota" con fiducia. L\'eccitazione ribolliva mentre immaginavo il mio prossimo viaggio, sapendo di aver assicurato il mio passaggio verso una destinazione lontana.',

      // --- DOM ELEMENTS ---
      const uiLangSelect = document.getElementById("ui-lang-select"); // New UI language select

      const nativeLangSelect = document.getElementById("native-lang-select");
      const targetLangSelect = document.getElementById("target-lang-select");
      const errorMessage = document.getElementById("error-message");

      const topicTitle = document.getElementById("topic-title");
      const learningText = document.getElementById("learning-text");
      const vocabList = document.getElementById("vocab-list");
      const nativeLangTitle = document.getElementById("native-lang-title");
      const nativeLangFullText = document.getElementById(
        "native-lang-full-text"
      );
      const targetLangTitle = document.getElementById("target-lang-title");
      const targetLangFullText = document.getElementById(
        "target-lang-full-text"
      );

      // --- FUNCTIONS ---

      function populateSelect(selectElement, data, selectedValue) {
        selectElement.innerHTML = "";
        const currentUILang = uiLangSelect.value || "en"; // Get current UI language

        for (const key in data) {
          const option = document.createElement("option");
          option.value = key;

          if (selectElement.id === "topic-select") {
            option.textContent = data[key][currentUILang];
          } else if (
            selectElement.id === "native-lang-select" ||
            selectElement.id === "target-lang-select"
          ) {
            // For native and target language dropdowns, display the language name in the current UI language
            option.textContent = languageDisplayNames[currentUILang][key];
          } else if (selectElement.id === "ui-lang-select") {
            // For UI language dropdown, display the language name in its own language
            option.textContent = data[key][key]; // e.g., Deutsch for 'de', English for 'en'
          } else {
            option.textContent = data[key];
          }

          if (key === selectedValue) {
            option.selected = true;
          }
          selectElement.appendChild(option);
        }
      }

      function updateUIText(lang) {
        const translations = uiTranslations[lang];
        if (!translations) return;

        // Update elements with data-key attribute
        document.querySelectorAll("[data-key]").forEach((element) => {
          const key = element.getAttribute("data-key");
          if (translations[key]) {
            element.textContent = translations[key];
          }
        });

        // Re-populate all selects to update their display names based on the new UI language
        populateSelect(uiLangSelect, languageDisplayNames, uiLangSelect.value); // Use languageDisplayNames for UI select
        populateSelect(topicSelect, topicNames, topicSelect.value);
        populateSelect(
          nativeLangSelect,
          languageDisplayNames,
          nativeLangSelect.value
        ); // Use languageDisplayNames for native select
        populateSelect(
          targetLangSelect,
          languageDisplayNames,
          targetLangSelect.value
        ); // Use languageDisplayNames for target select

        // Re-generate the main content to update dynamic titles and error messages
        generateText();
      }

      function generateText() {
        const selectedTopic = topicSelect.value;
        const selectedNativeLang = nativeLangSelect.value;
        const selectedTargetLang = targetLangSelect.value;
        const currentUILang = uiLangSelect.value || "en"; // Get current UI language

        if (selectedNativeLang === selectedTargetLang) {
          errorMessage.textContent =
            uiTranslations[currentUILang].errorMessageSameLanguage;
          topicTitle.textContent = uiTranslations[currentUILang].errorTitle;
          learningText.textContent = "";
          vocabList.innerHTML = "";
          nativeLangFullText.textContent = "";
          targetLangFullText.textContent = "";
          nativeLangTitle.textContent = "";
          targetLangTitle.textContent = "";
          return;
        } else {
          errorMessage.textContent = "";
        }

        const topicData = content[selectedTopic];
        const vocabulary = topicData.vocab;

        let mixedLangText = topicData.base[selectedNativeLang];
        let fullNativeText = topicData.base[selectedNativeLang];
        let fullTargetText = topicData.base[selectedTargetLang];

        const learnedWords = [];

        for (const key in vocabulary) {
          const nativeWord = vocabulary[key][selectedNativeLang];
          const targetWord = vocabulary[key][selectedTargetLang];
          learnedWords.push({ target: targetWord, native: nativeWord });

          const placeholder = new RegExp(`\\{${key}\\}`, "g");

          const replacementSpan = `<strong class="text-blue-400 font-semibold">${targetWord}</strong>`;
          const replacementNative = `<strong class="text-blue-400 font-semibold">${nativeWord}</strong>`;
          const replacementTranslation = `<strong class="text-blue-400 font-semibold">${targetWord}</strong>`;

          mixedLangText = mixedLangText.replace(placeholder, replacementSpan);

          fullNativeText = fullNativeText.replace(placeholder, replacementNative);
          fullTargetText = fullTargetText.replace(placeholder, replacementTranslation);
        }

        topicTitle.textContent = `${uiTranslations[currentUILang].topicPrefix}${topicNames[selectedTopic][currentUILang]}`;

        // Add playback button for learning text
  learningText.innerHTML = `<span id="learning-text-content">${mixedLangText}</span><br><br><button id="play-learning-text" title="Play" class="ml-2 px-2 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white flex items-center"><svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' viewBox='0 0 24 24'><path fill='currentColor' d='M8 5v14l11-7z'/></svg><span class="soundwave" style="display:none"><svg width="22" height="18" viewBox="0 0 22 18"><rect x="1" width="3" height="6" y="12"/><rect x="6" width="3" height="6" y="12"/><rect x="11" width="3" height="6" y="12"/><rect x="16" width="3" height="6" y="12"/></svg></span></button>`;

        // Add event listener for learning text playback
        const playLearningBtn = document.getElementById("play-learning-text");
        const soundwaveLearning = playLearningBtn.querySelector('.soundwave');
        playLearningBtn.onclick = function() {
          const text = document.getElementById("learning-text-content").innerText;
          speakText(text, selectedTargetLang, soundwaveLearning);
        };

        // Display native and target language titles using the UI language's translation of the language name
        nativeLangTitle.textContent = `${uiTranslations[currentUILang].originalTextTitle} (${languageDisplayNames[currentUILang][selectedNativeLang]})`;
        nativeLangFullText.innerHTML = fullNativeText;

        targetLangTitle.textContent = `${uiTranslations[currentUILang].translationTextTitle} (${languageDisplayNames[currentUILang][selectedTargetLang]})`;
        targetLangFullText.innerHTML = fullTargetText;

        vocabList.innerHTML = "";
        learnedWords.forEach((word, idx) => {
          const item = document.createElement("div");
          item.className = "flex justify-between items-center bg-slate-700/50 p-3 rounded-md";

          //TODO: svg in project folder. no internet needed
          item.innerHTML = `
            <span class="font-medium text-blue-300 flex items-center">
              ${word.target}
              <button title="Play" class="ml-2 px-1 py-0.5 rounded bg-blue-600 hover:bg-blue-700 text-white play-vocab flex items-center" data-idx="${idx}">
                <svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' viewBox='0 0 24 24'><path fill='currentColor' d='M8 5v14l11-7z'/></svg>
                <span class="soundwave" style="display:none"><svg width="22" height="18" viewBox="0 0 22 18"><rect x="1" width="3" height="6" y="12"/><rect x="6" width="3" height="6" y="12"/><rect x="11" width="3" height="6" y="12"/><rect x="16" width="3" height="6" y="12"/></svg></span>
              </button>
            </span>
            <span class="text-slate-400">${word.native}</span>
          `;
          vocabList.appendChild(item);
        });

        // Add event listeners for vocab playback
        vocabList.querySelectorAll('.play-vocab').forEach(btn => {
          const soundwave = btn.querySelector('.soundwave');
          btn.onclick = function() {
            const idx = btn.getAttribute('data-idx');
            const word = learnedWords[idx].target;
            speakText(word, selectedTargetLang, soundwave);
          };
        });
      // --- WEB SPEECH API ---
      function speakText(text, lang, soundwaveEl) {
        if (!window.speechSynthesis) return;
        const utter = new window.SpeechSynthesisUtterance(text);
        utter.lang = lang;
        window.speechSynthesis.cancel(); // Stop any current speech
        if (soundwaveEl) soundwaveEl.style.display = 'inline-block';
        utter.onend = utter.onerror = function() {
          if (soundwaveEl) soundwaveEl.style.display = 'none';
        };
        window.speechSynthesis.speak(utter);
      }
      }

      function initializeApp() {
        // New languageDisplayNames object to hold translated language names
        // This object now holds the *display names* of the languages themselves,
        // translated into each UI language.
        // This was moved outside initializeApp to be a global const.

        // Populate UI language select first
        populateSelect(uiLangSelect, languageDisplayNames, "en"); // Default UI to English

        // Add event listener for UI language change
        uiLangSelect.addEventListener("change", () =>
          updateUIText(uiLangSelect.value)
        );

        // Populate other selects (topic names will now use the selected UI language)
        populateSelect(topicSelect, topicNames, "booking_flight");
        populateSelect(nativeLangSelect, languageDisplayNames, "en");
        populateSelect(targetLangSelect, languageDisplayNames, "de");

        // Add event listeners for topic, native, and target language changes
        topicSelect.addEventListener("change", generateText);
        nativeLangSelect.addEventListener("change", generateText);
        targetLangSelect.addEventListener("change", generateText);

        // Initial generation and UI text update
        updateUIText(uiLangSelect.value); // Apply initial UI language
        generateText(); // Generate content based on initial selections
      }

      document.addEventListener("DOMContentLoaded", function() {
        initializeApp();
        // Hide/show menu logic
        const controlsCard = document.getElementById('controls-card');
        const toggleMenuBtn = document.getElementById('toggle-menu-btn');

          menuVisible = !menuVisible;
          controlsCard.style.display = menuVisible ? '' : 'none';
