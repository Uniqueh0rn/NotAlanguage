        },
        vocab: {

            en: "arrival time",
            es: "hora de llegada",
            fr: "heure d'arrivée",
            it: "orario di arrivo",
          },
          baggage_claim: {
            de: "Gepäckausgabe",
            en: "baggage claim",
            es: "recogida de equipaje",
            fr: "retrait des bagages",
            it: "ritiro bagagli",
          },
          carousel_conveyor_belt: {

            en: "carousel/conveyor belt",
            es: "cinta transportadora",
            fr: "tapis roulant",
            it: "nastro trasportatore",

          trolley_cart: {

            es: "carrito",
            fr: "chariot",

          },
          lost_and_found: {

            es: "objetos perdidos",
            fr: "objets trouvés",

      // --- Bus Travel Content Here ---
      bus_locations: { base: { en: "Bus content..." }, vocab: {} },
      bus_tickets_fares: { base: { en: "Bus tickets content..." }, vocab: {} },
      on_the_bus: { base: { en: "On the bus content..." }, vocab: {} },
      
      // --- Train Travel Content Here ---
      train_Station: { base: { en: "Train station content..." }, vocab: {} },
      train_tickets_fares: { base: { en: "Train tickets content..." }, vocab: {} },

      // --- Dining Content Here ---
      restaurant: { base: { en: "Restaurant content..." }, vocab: {} },

    const topicNames = {

          bus_tickets_fares: { en: "Bus tickets & fares", de: "Bustickets & Fahrpreise", es: "Boletos y tarifas de autobús", fr: "Billets et tarifs de bus", it: "Biglietti e tariffe dell'autobus" },

      travel_by_train: {

        subcategory: {
          train_Station: { en: "Train Station", de: "Bahnhof", es: "Estación de tren", fr: "Gare", it: "Stazione ferroviaria" },
          train_tickets_fares: { en: "Train tickets & fares", de: "Zugtickets & Fahrpreise", es: "Boletos y tarifas de tren", fr: "Billets et tarifs de train", it: "Biglietti e tariffe del treno" },
          on_the_train: { en: "On the Train", de: "Im Zug", es: "En el tren", fr: "Dans le train", it: "Sul treno" },
        },
      },
      restaurant: {
        en: "Dining Out", de: "Auswärts essen", es: "Comer fuera", fr: "Manger dehors", it: "Mangiare fuori",
        subcategory: {
          restaurant: { en: "At the Restaurant", de: "Im Restaurant", es: "En el restaurante", fr: "Au restaurant", it: "Al ristorante" },
          ordering_meal: { en: 'Ordering', de: "Bestellen", es: "Pedir", fr: "Commander", it: "Ordinare" },
          paying_leaving: { en: "Leaving", de: "Gehen", es: "salir", fr: "partir", it: "andarsene" }
        },
      },
      shopping: {
        en: "Shopping", de: "Einkaufen", es: "Compras", fr: "Shopping", it: "Shopping",
        subcategory: {
          shops: { en: "Shops", de: "Geschäfte", es: "Tiendas", fr: "Magasins", it: "Negozi" },
        },
      },
    };

    const languageNames = {
      de: { de: "Deutsch", en: "Englisch", es: "Spanisch", fr: "Französisch", it: "Italienisch" },
      en: { de: "German", en: "English", es: "Spanish", fr: "French", it: "Italian" },
      es: { de: "Alemán", en: "Inglés", es: "Español", fr: "Francés", it: "Italiano" },
      fr: { de: "Allemand", en: "Anglais", es: "Espagnol", fr: "Français", it: "Italien" },
      it: { de: "Tedesco", en: "Inglese", es: "Spagnolo", fr: "Francese", it: "Italiano" },
    };

    document.addEventListener("DOMContentLoaded", function() {
      const uiLangSelect = document.getElementById("chooseOption");
      const topicSelect = document.getElementById("chooseTopic");
      const nativeLangSelect = document.getElementById("selectionOne");
      const targetLangSelect = document.getElementById("selectionTwo");
      const topicTitle = document.getElementById("topicTitle");
      const learningText = document.getElementById("knowledgeText");
      const vocabList = document.getElementById("wordList");
      const nativeLangTitle = document.getElementById("native-lang-title");
      const nativeLangFullText = document.getElementById("native-lang-full-text");
      const targetLangTitle = document.getElementById("target-lang-title");
      const targetLangFullText = document.getElementById("target-lang-full-text");
      const errorMessage = document.getElementById("errorMessage");
      const contentDisplay = document.getElementById("content");
      const swapBtn = document.getElementById("dyorButton");
      const menuBox = document.getElementById("menuBox");
      const toggleMenuBtn = document.getElementById("menuButton");

      function speakText(text, lang, buttonEl) {
        if (!'speechSynthesis' in window) {
          alert("Sorry, your browser doesn't support text-to-speech.");
          return;
        }
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        
        const wasSpeaking = speechSynthesis.speaking;
        speechSynthesis.cancel();
        
        document.querySelectorAll('.tts-active').forEach(btn => togglePlayStop(btn, false));

        if (wasSpeaking && buttonEl && buttonEl.classList.contains('tts-active')) {
            return;
        }

        if (buttonEl) {
          togglePlayStop(buttonEl, true);
          utter.onend = () => togglePlayStop(buttonEl, false);
          utter.onerror = () => {
            console.error("Speech synthesis error");
            togglePlayStop(buttonEl, false);
          };
        }
        
        speechSynthesis.speak(utter);
      }
      
      function togglePlayStop(btn, isPlaying) {
        const svg = btn.querySelector("svg");
        const soundwave = btn.querySelector(".soundwave");
        if (!svg) return;
        
        if(isPlaying) {
          btn.classList.add('tts-active');
          svg.style.display = 'none';
          if (soundwave) soundwave.style.display = 'inline-block';
        } else {
          btn.classList.remove('tts-active');
          svg.style.display = 'inline-block';
          if (soundwave) soundwave.style.display = 'none';
        }
      }

      if (swapBtn) {
        swapBtn.addEventListener("click", function() {
            const temp = nativeLangSelect.value;
            nativeLangSelect.value = targetLangSelect.value;
            targetLangSelect.value = temp;
            generateText();
        });
      }

      let menuVisible = true;
      toggleMenuBtn.onclick = function() {
        menuVisible = !menuVisible;
        menuBox.style.display = menuVisible ? "" : "none";
        toggleMenuBtn.innerHTML = menuVisible ? '&#x25B2;' : '&#x25BC;';
      };
       toggleMenuBtn.innerHTML = '&#x25B2;';

      function populateSelect(selectElement, data, selectedValue) {
        const currentVal = selectElement.value;
        selectElement.innerHTML = "";
        const currentUi = uiLangSelect.value || "en";

        if (selectElement.id === "chooseTopic") {
          for (const key in data) {
            const category = data[key];
            if (category.subcategory) {
              const optgroup = document.createElement("optgroup");
              optgroup.label = category[currentUi] || category.en;
              for (const subKey in category.subcategory) {
                const option = document.createElement("option");
                option.value = subKey;
                option.textContent = category.subcategory[subKey][currentUi] || category.subcategory[subKey].en;
                optgroup.appendChild(option);
              }
              selectElement.appendChild(optgroup);
            }
          }
        } else {
          for (const key in data) {
            const option = document.createElement("option");
            option.value = key;
            if (selectElement.id === "selectionOne" || selectElement.id === "selectionTwo") {
              option.textContent = languageNames[currentUi][key];
            } else if (selectElement.id === "chooseOption") {
              option.textContent = languageNames[key][key];
            } else {
              option.textContent = data[key];
            }
            selectElement.appendChild(option);
          }
        }
        selectElement.value = selectedValue || currentVal;
      }

      function updateUIText(lang) {
        const translations = translatedMenu[lang];
        if (!translations) return;

        document.querySelectorAll("[data-key]").forEach((element) => {
          const key = element.getAttribute("data-key");
          if (translations[key]) {
            element.textContent = translations[key];
          }
        });
        
        document.querySelector('label[for="chooseOption"]').textContent = translations.uiLanguageLabel;
        document.querySelector('label[for="chooseTopic"]').textContent = translations.topicLabel;
        document.querySelector('label[for="selectionOne"]').textContent = translations.yourLanguageLabel;
        document.querySelector('label[for="selectionTwo"]').textContent = translations.targetLanguageLabel;

        populateSelect(uiLangSelect, languageNames, uiLangSelect.value);
        populateSelect(topicSelect, topicNames, topicSelect.value);
        populateSelect(nativeLangSelect, languageNames, nativeLangSelect.value);
        populateSelect(targetLangSelect, languageNames, targetLangSelect.value);

        generateText();
      }

      function generateText() {
        if (speechSynthesis.speaking) speechSynthesis.cancel();
        
        const selectedTopicKey = topicSelect.value;
        const selectedNativeLang = nativeLangSelect.value;
        const selectedTargetLang = targetLangSelect.value;
        const currentUi = uiLangSelect.value || "en";

        if (!selectedTopicKey || !selectedNativeLang || !selectedTargetLang) return;

        if (selectedNativeLang === selectedTargetLang) {
          errorMessage.textContent = translatedMenu[currentUi].errorMessageSameLanguage;
          contentDisplay.style.display = "none";
          topicTitle.style.display = "none";
          return;
        } else {
          errorMessage.textContent = "";
          contentDisplay.style.display = "";
           topicTitle.style.display = "block";
        }

        let topicDisplayName = '';
        let topicData = content[selectedTopicKey];

        for (const catKey in topicNames) {
          if (topicNames[catKey].subcategory && topicNames[catKey].subcategory[selectedTopicKey]) {
            topicDisplayName = topicNames[catKey].subcategory[selectedTopicKey][currentUi] || topicNames[catKey].subcategory[selectedTopicKey].en;
            break;
          }
        }

        topicTitle.textContent = topicDisplayName;
        
        if (!topicData || !topicData.base) {
            learningText.innerHTML = "Content not found.";
            vocabList.innerHTML = "";
            nativeLangFullText.innerHTML = "";
            targetLangFullText.innerHTML = "";
            return;
        }

        let mixedLangText = topicData.base[selectedNativeLang] || topicData.base.en;
        let fullNativeText = topicData.base[selectedNativeLang] || topicData.base.en;
        let fullTargetText = topicData.base[selectedTargetLang] || topicData.base.en;
        const learnedWords = [];

        for (const key in topicData.vocab) {
          const nativeWord = topicData.vocab[key][selectedNativeLang];
          const targetWord = topicData.vocab[key][selectedTargetLang];
          if (nativeWord && targetWord) {
            learnedWords.push({ target: targetWord, native: nativeWord });
            const placeholder = new RegExp(`\\{${key}\\}`, "g");
            mixedLangText = mixedLangText.replace(placeholder, `<strong class="highlight-word" title="${nativeWord}">${targetWord}</strong>`);
            fullNativeText = fullNativeText.replace(placeholder, `<strong class="highlight-word">${nativeWord}</strong>`);
            fullTargetText = fullTargetText.replace(placeholder, `<strong class="highlight-word">${targetWord}</strong>`);
          }
        }
        
        const playButtonHTML = (id) => `<button id="${id}" title="Play" class="play-button"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg><span class="soundwave"></span></button>`;
        
        learningText.innerHTML = `<span class="text-content">${mixedLangText}</span>` + playButtonHTML('play-learning-text');
        nativeLangFullText.innerHTML = `<span class="text-content">${fullNativeText}</span>` + playButtonHTML('play-native-text');
        targetLangFullText.innerHTML = `<span class="text-content">${fullTargetText}</span>` + playButtonHTML('play-target-text');

        document.getElementById('play-learning-text').addEventListener('click', (e) => speakText(learningText.querySelector('.text-content').innerText, selectedTargetLang, e.currentTarget));
        document.getElementById('play-native-text').addEventListener('click', (e) => speakText(nativeLangFullText.querySelector('.text-content').innerText, selectedNativeLang, e.currentTarget));
        document.getElementById('play-target-text').addEventListener('click', (e) => speakText(targetLangFullText.querySelector('.text-content').innerText, selectedTargetLang, e.currentTarget));
        
        nativeLangTitle.textContent = `${translatedMenu[currentUi].originalTextTitle} (${languageNames[currentUi][selectedNativeLang]})`;
        targetLangTitle.textContent = `${translatedMenu[currentUi].translationTextTitle} (${languageNames[currentUi][selectedTargetLang]})`;

        vocabList.innerHTML = "";
        learnedWords.forEach((word) => {
          const item = document.createElement("div");
          item.className = "vocab-item";
          item.innerHTML = `
              <span class="vocab-target-word">
                ${word.target}
              </span>
              <span class="vocab-native-word">${word.native}</span>
              <button title="Play" class="play-button vocab-play-button" data-word="${word.target}">
                  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                  <span class="soundwave"></span>
              </button>
            `;
          vocabList.appendChild(item);
        });

        document.querySelectorAll('.vocab-play-button').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const wordToSpeak = e.currentTarget.getAttribute('data-word');
            speakText(wordToSpeak, selectedTargetLang, e.currentTarget);
          });
        });
      }

      function initializeApp() {
        populateSelect(uiLangSelect, languageNames, "en");
        populateSelect(topicSelect, topicNames, "book_flight");
        populateSelect(nativeLangSelect, languageNames, "en");
        populateSelect(targetLangSelect, languageNames, "de");

        uiLangSelect.addEventListener("change", () => updateUIText(uiLangSelect.value));
        topicSelect.addEventListener("change", generateText);
        nativeLangSelect.addEventListener("change", generateText);
        targetLangSelect.addEventListener("change", generateText);

        updateUIText("en");
      }

      initializeApp();
    });
  </script>
