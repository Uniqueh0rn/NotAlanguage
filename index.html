<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/128/826/826070.png"
    />
    <title>Trovl.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .controls-card {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .soundwave {
        display: inline-block;
        vertical-align: middle;
        margin-left: 4px;
        width: 22px;
        height: 18px;
      }
      .soundwave rect {
        fill: #38bdf8;
        opacity: 0.7;
        animation: wave 1s infinite linear;
      }
      .soundwave rect:nth-child(2) {
        animation-delay: 0.2s;
      }
      .soundwave rect:nth-child(3) {
        animation-delay: 0.4s;
      }
      .soundwave rect:nth-child(4) {
        animation-delay: 0.6s;
      }
      .soundwave rect:nth-child(5) {
        animation-delay: 0.8s;
      }
      @keyframes wave {
        0%,
        100% {
          height: 6px;
          y: 12px;
        }
        50% {
          height: 18px;
          y: 0px;
        }
      }
    </style>
  </head>
  <body class="bg-slate-900 text-white antialiased">
    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 md:py-12">
      <!-- Header -->
      <header class="text-center mb-4 md:mb-12">
        <div class="flex items-center justify-center gap-3 mb-2">
          <img
            src="https://cdn-icons-png.flaticon.com/128/826/826070.png"
            width="42"
            height="42"
            alt="App Icon"
            style="box-shadow: 0 1px 4px #38bdf8; border-radius: 12px"
          />
          <h1
            class="text-4xl md:text-5xl font-bold text-white"
            data-key="appTitle"
          >
            Trovl
          </h1>
        </div>
        <span class="text-lg md:text-xl text-slate-400" data-key="appSubtitle">
          Travel the word.

              class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-1 shadow-lg transition flex items-center justify-center"

                width: 32px;
                height: 32px;
                min-width: 32px;
                min-height: 32px;
                box-sizing: border-box;
              "
            >

                width="22"
                height="22"

            </button>

                class="block mb-2 text-sm font-medium text-slate-300"
                data-key="targetLanguageLabel"

        </div>

        </div>
      </main>
    </div>

            en: "Once on board, find your assigned {cabin_seat}, whether it's an {aisle_seat} or a {window_seat}. Store your belongings in the {overhead_bin_locker}.<br><br>The {cabin_crew_flight_attendant} will provide safety instructions and service throughout the flight. The pilots operate the aircraft from the {cockpit}. Remember to {fasten_your_seatbelt} when instructed, especially during {turbulence}.<br><br>If your journey involves a {connecting_flight}, you'll have a {layover_stopover} at an intermediate airport before continuing to your final destination.<br><br>",
            de: "Einmal an Bord, finden Sie Ihren zugewiesenen {cabin_seat}, sei es ein {aisle_seat} oder ein {window_seat}. Verstauen Sie Ihre Habseligkeiten im {overhead_bin_locker}.<br><br>Das {cabin_crew_flight_attendant} wird während des gesamten Fluges Sicherheitsanweisungen und Service bereitstellen. Die Piloten steuern das Flugzeug vom {cockpit}. Denken Sie daran, Ihren {fasten_your_seatbelt}, wenn Sie dazu aufgefordert werden, besonders bei {turbulence}.<br><br>Wenn Ihre Reise einen {connecting_flight} beinhaltet, haben Sie einen {layover_stopover} an einem Zwischenflughafen, bevor Sie zu Ihrem endgültigen Ziel weiterreisen.<br><br>",
            es: "Una vez a bordo, encuentra tu {cabin_seat} asignado, ya sea un {aisle_seat} o un {window_seat}. Guarda tus pertenencias en el {overhead_bin_locker}.<br><br>La {cabin_crew_flight_attendant} proporcionará instrucciones de seguridad y servicio durante todo el vuelo. Los pilotos operan la aeronave desde la {cockpit}. Recuerda {fasten_your_seatbelt} cuando se te indique, especialmente durante la {turbulence}.<br><br>Si tu viaje incluye un {connecting_flight}, tendrás una {layover_stopover} en un aeropuerto intermedio antes de continuar a tu destino final.<br><br>",
            fr: "Une fois à bord, trouvez votre {cabin_seat} assigné, qu'il s'agisse d'un {aisle_seat} ou d'un {window_seat}. Rangez vos affaires dans le {overhead_bin_locker}.<br><br>Le {cabin_crew_flight_attendant} fournira des instructions de sécurité et un service tout au long du vol. Les pilotes opèrent l'avion depuis le {cockpit}. N'oubliez pas de {fasten_your_seatbelt} lorsque cela vous est demandé, en particulier en cas de {turbulence}.<br><br>Si votre voyage comprend un {connecting_flight}, vous aurez une {layover_stopover} dans un aéroport intermédiaire avant de continuer vers votre destination finale.<br><br>",
            it: "Una volta a bordo, trova il tuo {cabin_seat} assegnato, che sia un {aisle_seat} o un {window_seat}. Riponi i tuoi effetti personali nel {overhead_bin_locker}.<br><br>Il {cabin_crew_flight_attendant} fornirà istruzioni di sicurezza e servizio durante tutto il volo. I piloti operano l'aeromobile dalla {cockpit}. Ricorda di {fasten_your_seatbelt} quando ti viene indicato, specialmente durante la {turbulence}.<br><br>Se il tuo viaggio prevede un {connecting_flight}, avrai una {layover_stopover} in un aeroporto intermedio prima di proseguire verso la tua destinazione finale.<br><br>",

        // --- Plane Arrival ---
        plane_arrival: {
          base: {
            en: "Upon reaching your destination, proceed to the {arrivals} area. The {landed_arrival_time} will be displayed on screens.<br><br>Your next stop is {baggage_claim} to retrieve your checked luggage from the {carousel_conveyor_belt}. If you have multiple bags or heavy items, a {trolley_cart} can be very helpful.<br><br>In the unfortunate event that your baggage is missing, report it immediately to the {lost_and_found} office.<br><br>",
            de: "Nach Erreichen Ihres Ziels begeben Sie sich zum Bereich {arrivals}. Die {landed_arrival_time} wird auf den Bildschirmen angezeigt.<br><br>Ihr nächster Halt ist die {baggage_claim}, um Ihr aufgegebenes Gepäck vom {carousel_conveyor_belt} abzuholen. Wenn Sie mehrere Taschen oder schwere Gegenstände haben, kann ein {trolley_cart} sehr hilfreich sein.<br><br>Im unglücklichen Fall, dass Ihr Gepäck fehlt, melden Sie es sofort beim {lost_and_found} Büro.<br><br>",
            es: "Al llegar a su destino, diríjase a la zona de {arrivals}. La {landed_arrival_time} se mostrará en las pantallas.<br><br>Su próxima parada es la {baggage_claim} para recoger su equipaje facturado de la {carousel_conveyor_belt}. Si tiene varias bolsas o artículos pesados, un {trolley_cart} puede ser muy útil.<br><br>En el desafortunado caso de que su equipaje falte, repórtelo inmediatamente a la oficina de {lost_and_found}.<br><br>",
            fr: "Une fois arrivé à destination, rendez-vous dans la zone des {arrivals}. L'{landed_arrival_time} sera affichée sur les écrans.<br><br>Votre prochaine étape est la {baggage_claim} pour récupérer vos bagages enregistrés sur le {carousel_conveyor_belt}. Si vous avez plusieurs sacs ou des objets lourds, un {trolley_cart} peut être très utile.<br><br>Dans le cas malheureux où vos bagages seraient manquants, signalez-le immédiatement au bureau des {lost_and_found}.<br><br>",
            it: "Una volta raggiunta la destinazione, procedi all'area degli {arrivals}. L'{landed_arrival_time} sarà visualizzata sugli schermi.<br><br>La tua prossima fermata è la {baggage_claim} per ritirare il tuo bagaglio registrato dal {carousel_conveyor_belt}. Se hai più borse o oggetti pesanti, un {trolley_cart} può essere molto utile.<br><br>Nel caso sfortunato in cui il tuo bagaglio manchi, segnalalo immediatamente all'ufficio {lost_and_found}.<br><br>",

        bus_locations: {
          base: {
            en: "When traveling by bus, locate the nearest {bus_stop} or a {bus_shelter} for protection from the elements. For longer journeys or transfers, head to a {bus_station_bus_terminal} or an {interchange_transit_center}.<br><br>Check the {timetable_schedule} for your desired {route_number} and {destination}. You might take a {local_bus} for short trips, an {express_bus} for faster travel with fewer stops, or a {shuttle_bus} for specific routes like airport transfers. For longer distances between cities, a {coach_intercity_bus} is ideal. If you're out late, a {night_bus} might be available.<br><br>",
            de: "Wenn Sie mit dem Bus reisen, suchen Sie die nächstgelegene {bus_stop} oder eine {bus_shelter} zum Schutz vor den Elementen. Für längere Reisen oder Transfers begeben Sie sich zu einer {bus_station_bus_terminal} oder einem {interchange_transit_center}.<br><br>Überprüfen Sie den {timetable_schedule} für Ihre gewünschte {route_number} und {destination}. Sie könnten einen {local_bus} für kurze Fahrten, einen {express_bus} für schnellere Reisen mit weniger Haltestellen oder einen {shuttle_bus} für bestimmte Routen wie Flughafentransfers nehmen. Für längere Strecken zwischen Städten ist ein {coach_intercity_bus} ideal. Wenn Sie spät unterwegs sind, könnte ein {night_bus} verfügbar sein.<br><br>",
            es: "Cuando viaje en autobús, localice la {bus_stop} más cercana o una {bus_shelter} para protegerse de los elementos. Para viajes más largos o traslados, diríjase a una {bus_station_bus_terminal} o a un {interchange_transit_center}.<br><br>Consulte el {timetable_schedule} para su {route_number} y {destination} deseados. Puede tomar un {local_bus} para viajes cortos, un {express_bus} para viajes más rápidos con menos paradas, o un {shuttle_bus} para rutas específicas como traslados al aeropuerto. Para distancias más largas entre ciudades, un {coach_intercity_bus} es ideal. Si sale tarde, podría haber un {night_bus} disponible.<br><br>",
            fr: "Lorsque vous voyagez en bus, localisez l'{bus_stop} la plus proche ou un {bus_shelter} pour vous protéger des éléments. Pour les trajets plus longs ou les transferts, rendez-vous à une {bus_station_bus_terminal} ou à un {interchange_transit_center}.<br><br>Vérifiez le {timetable_schedule} pour votre {route_number} et {destination} souhaités. Vous pouvez prendre un {local_bus} pour les trajets courts, un {express_bus} pour un voyage plus rapide avec moins d'arrêts, ou un {shuttle_bus} pour des itinéraires spécifiques comme les transferts aéroportuaires. Pour les longues distances entre les villes, un {coach_intercity_bus} est idéal. Si vous sortez tard, un {night_bus} pourrait être disponible.<br><br>",
            it: "Quando viaggi in autobus, individua la {bus_stop} più vicina o una {bus_shelter} per proteggerti dagli agenti atmosferici. Per viaggi più lunghi o trasferimenti, dirigiti verso una {bus_station_bus_terminal} o un {interchange_transit_center}.<br><br>Controlla il {timetable_schedule} per il tuo {route_number} e {destination} desiderati. Potresti prendere un {local_bus} per viaggi brevi, un {express_bus} per viaggi più veloci con meno fermate, o un {shuttle_bus} per percorsi specifici come i trasferimenti aeroportuali. Per distanze più lunghe tra le città, un {coach_intercity_bus} è ideale. Se esci tardi, potrebbe essere disponibile un {night_bus}.<br><br>",

        // --- Bus Tickets & Fares ---
        bus_tickets_fares: {
          base: {
            en: "To ride the bus, you'll need to pay the {fare} and obtain a {ticket}. You can purchase a {single_one_way} ticket for a single journey or a {return_round_trip} ticket for a round trip. For frequent travel, a {day_pass_travel_card} might be more economical.<br><br>Payment methods vary: some buses have a {fare_box} for cash, while others rely on a {ticket_machine} for purchases. Remember to {validate} your ticket if required. Many systems now accept {contactless} payments. If paying with cash, it's often helpful to have {exact_change}.<br><br>",
            de: "Um den Bus zu fahren, müssen Sie den {fare} bezahlen und ein {ticket} erhalten. Sie können ein {single_one_way} Ticket für eine einfache Fahrt oder ein {return_round_trip} Ticket für eine Hin- und Rückfahrt kaufen. Für häufige Reisen könnte eine {day_pass_travel_card} wirtschaftlicher sein.<br><br>Die Zahlungsmethoden variieren: Einige Busse haben eine {fare_box} für Bargeld, während andere auf einen {ticket_machine} für den Kauf angewiesen sind. Denken Sie daran, Ihr Ticket zu {validate}, wenn dies erforderlich ist. Viele Systeme akzeptieren jetzt {contactless} Zahlungen. Wenn Sie bar bezahlen, ist es oft hilfreich, {exact_change} zu haben.<br><br>",
            es: "Para viajar en autobús, necesitará pagar la {fare} y obtener un {ticket}. Puede comprar un billete de {single_one_way} para un solo viaje o un billete de {return_round_trip} para un viaje de ida y vuelta. Para viajes frecuentes, un {day_pass_travel_card} podría ser más económico.<br><br>Los métodos de pago varían: algunos autobuses tienen una {fare_box} para efectivo, mientras que otros dependen de una {ticket_machine} para las compras. Recuerde {validate} su billete si es necesario. Muchos sistemas ahora aceptan pagos {contactless}. Si paga en efectivo, a menudo es útil tener {exact_change}.<br><br>",
            fr: "Pour prendre le bus, vous devrez payer le {fare} et obtenir un {ticket}. Vous pouvez acheter un billet {single_one_way} pour un trajet simple ou un billet {return_round_trip} pour un aller-retour. Pour les voyages fréquents, un {day_pass_travel_card} peut être plus économique.<br><br>Les méthodes de paiement varient : certains bus disposent d'une {fare_box} pour l'argent liquide, tandis que d'autres utilisent une {ticket_machine} pour les achats. N'oubliez pas de {validate} votre billet si nécessaire. De nombreux systèmes acceptent désormais les paiements {contactless}. Si vous payez en espèces, il est souvent utile d'avoir la {exact_change}.<br><br>",
            it: "Per viaggiare in autobus, dovrai pagare la {fare} e ottenere un {ticket}. Puoi acquistare un biglietto {single_one_way} per un viaggio singolo o un biglietto {return_round_trip} per un viaggio di andata e ritorno. Per viaggi frequenti, un {day_pass_travel_card} potrebbe essere più economico.<br><br>I metodi di pagamento variano: alcuni autobus hanno una {fare_box} per contanti, mentre altri si affidano a una {ticket_machine} per gli acquisti. Ricorda di {validate} il tuo biglietto se necessario. Molti sistemi ora accettano pagamenti {contactless}. Se paghi in contanti, è spesso utile avere la {exact_change}.<br><br>",

        // --- On the Bus ---
        on_the_bus: {
          base: {
            en: "When your bus arrives, wait for passengers to {to_alight_to_get_off} before you {to_board_to_get_on}. Once inside, move down the {aisle} and find a seat, being mindful of {priority_seating} for those who need it.<br><br>Keep an eye on the {next_stop_display} to know when your stop is approaching. To signal your stop, press the {stop_request_button_bell}. The {driver} will then pull over at the next designated stop.<br><br>",
            de: "Wenn Ihr Bus ankommt, warten Sie, bis die Passagiere {to_alight_to_get_off} sind, bevor Sie {to_board_to_get_on}. Gehen Sie einmal drinnen den {aisle} entlang und suchen Sie sich einen Sitzplatz, wobei Sie auf {priority_seating} für diejenigen achten, die ihn benötigen.<br><br>Behalten Sie die {next_stop_display} im Auge, um zu wissen, wann Ihre Haltestelle naht. Um Ihre Haltestelle zu signalisieren, drücken Sie den {stop_request_button_bell}. Der {driver} wird dann an der nächsten vorgesehenen Haltestelle anhalten.<br><br>",
            es: "Cuando llegue su autobús, espere a que los pasajeros {to_alight_to_get_off} antes de {to_board_to_get_on}. Una vez dentro, avance por el {aisle} y busque un asiento, teniendo en cuenta los {priority_seating} para quienes lo necesiten.<br><br>Esté atento al {next_stop_display} para saber cuándo se acerca su parada. Para señalar su parada, presione el {stop_request_button_bell}. El {driver} se detendrá en la siguiente parada designada.<br><br>",
            fr: "Lorsque votre bus arrive, attendez que les passagers {to_alight_to_get_off} avant de {to_board_to_get_on}. Une fois à l'intérieur, avancez dans l'{aisle} et trouvez un siège, en tenant compte des {priority_seating} pour ceux qui en ont besoin.<br><br>Gardez un œil sur le {next_stop_display} pour savoir quand votre arrêt approche. Pour signaler votre arrêt, appuyez sur le {stop_request_button_bell}. Le {driver} s'arrêtera alors au prochain arrêt désigné.<br><br>",
            it: "Quando arriva il tuo autobus, aspetta che i passeggeri {to_alight_to_get_off} prima di {to_board_to_get_on}. Una volta all'interno, percorri il {aisle} e trova un posto a sedere, tenendo conto dei {priority_seating} per chi ne ha bisogno.<br><br>Tieni d'occhio il {next_stop_display} per sapere quando si avvicina la tua fermata. Per segnalare la tua fermata, premi il {stop_request_button_bell}. Il {driver} si fermerà alla prossima fermata designata.<br><br>",

            de: "Am {train_station_union_station} finden Sie die {concourse}, die zum {platform} führt, wo Züge auf dem {track} ankommen und abfahren. Für Tickets besuchen Sie das {ticket_office_ticket_counter} oder nutzen Sie einen {ticket_machine_kiosk}.<br><br>Überprüfen Sie die {arrivals_board} und {departures_board} für Zugzeiten und Bahnsteiginformationen. Wenn Sie Hilfe benötigen, ist normalerweise ein {information_desk} verfügbar. Für die vorübergehende Aufbewahrung suchen Sie nach {left_luggage_luggage_lockers}.<br><br>Zugtypen variieren: Ein {local_train_commuter_train} bedient städtische Gebiete, ein {regional_train} verbindet nahegelegene Städte, und ein {intercity_long_distance_train} deckt größere Entfernungen ab. Für Geschwindigkeit entscheiden Sie sich für einen {high_speed_train}, oder für Nachtfahrten einen {sleeper_train_night_train}.<br><br>",
            es: "En la {train_station_union_station}, encontrará el {concourse} que conduce a la {platform} donde los trenes llegan y salen en la {track}. Para boletos, visite la {ticket_office_ticket_counter} o use una {ticket_machine_kiosk}.<br><br>Consulte el {arrivals_board} y el {departures_board} para conocer los horarios de los trenes y la información de las plataformas. Si necesita ayuda, generalmente hay un {information_desk} disponible. Para almacenamiento temporal, busque {left_luggage_luggage_lockers}.<br><br>Los tipos de tren varían: un {local_train_commuter_train} sirve a áreas urbanas, un {regional_train} conecta ciudades cercanas, y un {intercity_long_distance_train} cubre distancias mayores. Para mayor velocidad, opte por un {high_speed_train}, o para viajes nocturnos, un {sleeper_train_night_train}.<br><br>",
            fr: "À la {train_station_union_station}, vous trouverez le {concourse} qui mène à la {platform} où les trains arrivent et partent sur la {track}. Pour les billets, rendez-vous au {ticket_office_ticket_counter} ou utilisez une {ticket_machine_kiosk}.<br><br>Consultez le {arrivals_board} et le {departures_board} pour les horaires des trains et les informations sur les quais. Si vous avez besoin d'aide, un {information_desk} est généralement disponible. Pour le stockage temporaire, cherchez des {left_luggage_luggage_lockers}.<br><br>Les types de trains varient : un {local_train_commuter_train} dessert les zones urbaines, un {regional_train} relie les villes voisines, et un {intercity_long_distance_train} couvre de plus grandes distances. Pour la vitesse, optez pour un {high_speed_train}, ou pour les voyages de nuit, un {sleeper_train_night_train}.<br><br>",
            it: "Alla {train_station_union_station} troverai il {concourse} che conduce alla {platform} dove i treni arrivano e partono sul {track}. Per i biglietti, visita il {ticket_office_ticket_counter} o utilizza una {ticket_machine_kiosk}.<br><br>Controlla il {arrivals_board} e il {departures_board} per gli orari dei treni e le informazioni sulle piattaforme. Se hai bisogno di assistenza, di solito è disponibile un {information_desk}. Per lo stoccaggio temporaneo, cerca i {left_luggage_luggage_lockers}.<br><br>I tipi di treno variano: un {local_train_commuter_train} serve le aree urbane, un {regional_train} collega le città vicine e un {intercity_long_distance_train} copre distanze maggiori. Per la velocità, opta per un {high_speed_train}, o per i viaggi notturni, un {sleeper_train_night_train}.<br><br>",

        // --- Train Tickets & Fares ---
        train_tickets_fares: {
          base: {
            en: 'To travel by train, you\'ll need to purchase a {ticket} for the appropriate {fare}. You can choose a {single_one_way} journey or a {return_round_trip}. For extensive travel, a {rail_pass} might be beneficial.<br><br>Some journeys require a {seat_reservation} for a specific {carriage_car}. Depending on the ticket type, {validation} might be necessary before boarding. During your journey, a {ticket_inspector_conductor} will check your ticket.<br><br>',

        // --- On the Train ---
        on_the_train: {
          base: {
            en: 'When your train arrives, {to_board} the correct {carriage_car}. Find your {seat}, whether it\'s an {aisle_seat} or a {window_seat}, and place your bags on the {overhead_rack_luggage_rack}.<br><br>During the journey, you might visit the {dining_car} for a meal or the {buffet_car_snack_bar} for refreshments. Some trains offer a {quiet_carriage} for a more peaceful ride. Remember to {to_alight} at your destination. If your journey involves a {connecting_train_connection}, you\'ll need to {transfer_change} trains at an intermediate station.<br><br>',

        },
        fr: {

        },
        it: {
          de: "Tedesco",
          en: "Inglese",

      // --- UI TEXT TRANSLATIONS ---
      const uiTranslations = {
        de: {
          uiLanguageLabel: "App Sprache",
          topicLabel: "Thema",
          yourLanguageLabel: "Deine Sprache",
          targetLanguageLabel: "Zielsprache",
          errorMessageSameLanguage:

          targetLanguageLabel: "Target Language",

          errorTitle: "Error",
          learningTextTitle: "Learning Text",

        },

          errorMessageSameLanguage:

        },
        fr: {

          targetLanguageLabel: "Langue cible",
          errorMessageSameLanguage:
            "Veuillez sélectionner deux langues différentes.",
          errorTitle: "Erreur",
          learningTextTitle: "Texte d'apprentissage",
          vocabListTitle: "Liste de vocabulaire",
          originalTextTitle: "Texte original",
          translationTextTitle: "Traduction",
        },
        it: {
          uiLanguageLabel: "Lingua dell'app",
          topicLabel: "Argomento",
          yourLanguageLabel: "La tua lingua",
          targetLanguageLabel: "Lingua di destinazione",
          errorMessageSameLanguage:
            "Si prega di selezionare due lingue diverse.",
          errorTitle: "Errore",
          learningTextTitle: "Testo di apprendimento",
          vocabListTitle: "Lista di vocaboli",
          originalTextTitle: "Testo originale",
          translationTextTitle: "Traduzione",
        },
      };

      // --- DOM ELEMENTS ---
      const uiLangSelect = document.getElementById("ui-lang-select"); // New UI language select
      const topicSelect = document.getElementById("topic-select");
      const nativeLangSelect = document.getElementById("native-lang-select");
      const targetLangSelect = document.getElementById("target-lang-select");
      const errorMessage = document.getElementById("error-message");

      const topicTitle = document.getElementById("topic-title");
      const learningText = document.getElementById("learning-text");
      const vocabList = document.getElementById("vocab-list");
      const nativeLangTitle = document.getElementById("native-lang-title");
      const nativeLangFullText = document.getElementById(
        "native-lang-full-text"
      );
      const targetLangTitle = document.getElementById("target-lang-title");
      const targetLangFullText = document.getElementById(
        "target-lang-full-text"
      );

      // --- FUNCTIONS ---
      // --- SWAP BUTTON LOGIC ---
      document.addEventListener("DOMContentLoaded", function () {
        const swapBtn = document.getElementById("swap-lang-btn");
        if (swapBtn) {
          swapBtn.addEventListener("click", function () {
            const nativeSelect = document.getElementById("native-lang-select");
            const targetSelect = document.getElementById("target-lang-select");
            if (nativeSelect && targetSelect) {
              const temp = nativeSelect.value;
              nativeSelect.value = targetSelect.value;
              targetSelect.value = temp;
              // Trigger change events if needed
              nativeSelect.dispatchEvent(new Event("change"));
              targetSelect.dispatchEvent(new Event("change"));
              generateText();
            }
          });
        }
      });
      function populateSelect(selectElement, data, selectedValue) {
        selectElement.innerHTML = "";
        const currentUILang = uiLangSelect.value || "en"; // Get current UI language

        if (selectElement.id === "topic-select") {
          for (const key in data) {
            if (data[key].subcategories) {
              const optgroup = document.createElement("optgroup");
              optgroup.label = data[key][currentUILang] || data[key].en;
              for (const subKey in data[key].subcategories) {
                const option = document.createElement("option");
                option.value = subKey;
                option.textContent =
                  data[key].subcategories[subKey][currentUILang] ||
                  data[key].subcategories[subKey].en;
                if (subKey === selectedValue) option.selected = true;
                optgroup.appendChild(option);
              }
              selectElement.appendChild(optgroup);
            } else {
              const option = document.createElement("option");
              option.value = key;
              option.textContent = data[key][currentUILang] || data[key].en;
              if (key === selectedValue) option.selected = true;
              selectElement.appendChild(option);
            }
          }
        } else {
          for (const key in data) {
            const option = document.createElement("option");
            option.value = key;
            if (
              selectElement.id === "native-lang-select" ||
              selectElement.id === "target-lang-select"
            ) {
              option.textContent = languageDisplayNames[currentUILang][key];
            } else if (selectElement.id === "ui-lang-select") {
              option.textContent = data[key][key];
            } else {
              option.textContent = data[key];
            }
            if (key === selectedValue) option.selected = true;
            selectElement.appendChild(option);
          }
        }
      }

      function updateUIText(lang) {
        const translations = uiTranslations[lang];
        if (!translations) return;

        // Update elements with data-key attribute
        document.querySelectorAll("[data-key]").forEach((element) => {
          const key = element.getAttribute("data-key");
          if (translations[key]) {
            element.textContent = translations[key];
          }
        });

        // Re-populate all selects to update their display names based on the new UI language
        populateSelect(uiLangSelect, languageDisplayNames, uiLangSelect.value); // Use languageDisplayNames for UI select
        populateSelect(topicSelect, topicNames, topicSelect.value);
        populateSelect(
          nativeLangSelect,
          languageDisplayNames,
          nativeLangSelect.value
        ); // Use languageDisplayNames for native select
        populateSelect(
          targetLangSelect,
          languageDisplayNames,
          targetLangSelect.value
        ); // Use languageDisplayNames for target select

        // Re-generate the main content to update dynamic titles and error messages
        generateText();
      }

      function generateText() {
        const selectedTopic = topicSelect.value;
        const selectedNativeLang = nativeLangSelect.value;
        const selectedTargetLang = targetLangSelect.value;
        const currentUILang = uiLangSelect.value || "en"; // Get current UI language

        const contentDisplay = document.getElementById("content-display");
        if (selectedNativeLang === selectedTargetLang) {
          errorMessage.textContent =
            uiTranslations[currentUILang].errorMessageSameLanguage;
          topicTitle.textContent = uiTranslations[currentUILang].errorTitle;
          learningText.textContent = "";
          vocabList.innerHTML = "";
          nativeLangFullText.textContent = "";
          targetLangFullText.textContent = "";
          nativeLangTitle.textContent = "";
          targetLangTitle.textContent = "";
          contentDisplay.style.display = "none";
          return;
        } else {
          errorMessage.textContent = "";
          contentDisplay.style.display = "block";
        }

        // Dynamically find topic display name for any category/subcategory structure
        let topicDisplayName = selectedTopic;
        for (const catKey in topicNames) {
          if (catKey === selectedTopic && topicNames[catKey][currentUILang]) {
            topicDisplayName =
              topicNames[catKey][currentUILang] || topicNames[catKey].en;
            break;
          }
          if (
            topicNames[catKey].subcategories &&
            topicNames[catKey].subcategories[selectedTopic]
          ) {
            topicDisplayName =
              topicNames[catKey].subcategories[selectedTopic][currentUILang] ||
              topicNames[catKey].subcategories[selectedTopic].en;
            break;
          }
        }

        const topicData = content[selectedTopic];
        if (!topicData) {
          topicTitle.textContent = topicDisplayName;
          learningText.textContent = "";
          vocabList.innerHTML = "";
          nativeLangFullText.textContent = "";
          targetLangFullText.textContent = "";
          nativeLangTitle.textContent = "";
          targetLangTitle.textContent = "";
          return;
        }
        const vocabulary = topicData.vocab;

        let mixedLangText = topicData.base[selectedNativeLang];
        let fullNativeText = topicData.base[selectedNativeLang];
        let fullTargetText = topicData.base[selectedTargetLang];

        const learnedWords = [];

        for (const key in vocabulary) {
          const nativeWord = vocabulary[key][selectedNativeLang];
          const targetWord = vocabulary[key][selectedTargetLang];
          learnedWords.push({ target: targetWord, native: nativeWord });

          const placeholder = new RegExp(`\{${key}\}`, "g");

          const replacementSpan = `<strong class=\"text-blue-400 font-semibold\">${targetWord}</strong>`;
          const replacementNative = `<strong class=\"text-blue-400 font-semibold\">${nativeWord}</strong>`;
          const replacementTranslation = `<strong class=\"text-blue-400 font-semibold\">${targetWord}</strong>`;

          mixedLangText = mixedLangText.replace(placeholder, replacementSpan);

          fullNativeText = fullNativeText.replace(
            placeholder,
            replacementNative
          );
          fullTargetText = fullTargetText.replace(
            placeholder,
            replacementTranslation
          );
        }

        topicTitle.textContent = topicDisplayName;

        // Add tooltips to 'to learn' words in learning text
        let tooltipMixedLangText = topicData.base[selectedNativeLang];
        for (const key in vocabulary) {
          const nativeWord = vocabulary[key][selectedNativeLang];
          const targetWord = vocabulary[key][selectedTargetLang];
          tooltipMixedLangText = tooltipMixedLangText.replace(
            new RegExp(`\\{${key}\\}`, "g"),
            `<strong class="text-blue-400 font-semibold" title="${nativeWord}">${targetWord}</strong>`
          );
        }

        // Add playback button for learning text
        learningText.innerHTML = `<span id="learning-text-content">${tooltipMixedLangText}</span><button id="play-learning-text" title="Play" class="ml-2 px-2 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white flex items-center"><svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' viewBox='0 0 24 24'><path fill='currentColor' d='M8 5v14l11-7z'/></svg><span class="soundwave" style="display:none"><svg width="22" height="18" viewBox="0 0 22 18"><rect x="1" width="3" height="6" y="12"/><rect x="6" width="3" height="6" y="12"/><rect x="11" width="3" height="6" y="12"/><rect x="16" width="3" height="6" y="12"/></svg></span></button>`;

        // Add event listener for learning text playback
        const playLearningBtn = document.getElementById("play-learning-text");
        const soundwaveLearning = playLearningBtn.querySelector(".soundwave");
        playLearningBtn.onclick = function () {
          const text = document.getElementById(
            "learning-text-content"
          ).innerText;
          togglePlayStop(playLearningBtn, true);
          speakText(text, selectedTargetLang, soundwaveLearning, function () {
            togglePlayStop(playLearningBtn, false);
          });
        };

        // Display native and target language titles using the UI language's translation of the language name
        nativeLangTitle.textContent = `${uiTranslations[currentUILang].originalTextTitle} (${languageDisplayNames[currentUILang][selectedNativeLang]})`;
        // Add playback button for native text
        nativeLangFullText.innerHTML = `<span id="native-lang-full-text-content">${fullNativeText}</span><button id="play-native-lang-text" title="Play" class="ml-2 px-2 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white flex items-center"><svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' viewBox='0 0 24 24'><path fill='currentColor' d='M8 5v14l11-7z'/></svg><span class="soundwave" style="display:none"><svg width="22" height="18" viewBox="0 0 22 18"><rect x="1" width="3" height="6" y="12"/><rect x="6" width="3" height="6" y="12"/><rect x="11" width="3" height="6" y="12"/><rect x="16" width="3" height="6" y="12"/></svg></span></button>`;

        targetLangTitle.textContent = `${uiTranslations[currentUILang].translationTextTitle} (${languageDisplayNames[currentUILang][selectedTargetLang]})`;
        // Add playback button for translated text
        targetLangFullText.innerHTML = `<span id="target-lang-full-text-content">${fullTargetText}</span><button id="play-target-lang-text" title="Play" class="ml-2 px-2 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white flex items-center"><svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' viewBox='0 0 24 24'><path fill='currentColor' d='M8 5v14l11-7z'/></svg><span class="soundwave" style="display:none"><svg width="22" height="18" viewBox="0 0 22 18"><rect x="1" width="3" height="6" y="12"/><rect x="6" width="3" height="6" y="12"/><rect x="11" width="3" height="6" y="12"/><rect x="16" width="3" height="6" y="12"/></svg></span></button>`;
        // Add event listeners for native and translated text playback
        const playNativeBtn = document.getElementById("play-native-lang-text");
        const soundwaveNative = playNativeBtn.querySelector(".soundwave");
        playNativeBtn.onclick = function () {
          const text = document.getElementById(
            "native-lang-full-text-content"
          ).innerText;
          togglePlayStop(playNativeBtn, true);
          speakText(text, selectedNativeLang, soundwaveNative, function () {
            togglePlayStop(playNativeBtn, false);
          });
        };

        const playTargetBtn = document.getElementById("play-target-lang-text");
        const soundwaveTarget = playTargetBtn.querySelector(".soundwave");
        playTargetBtn.onclick = function () {
          const text = document.getElementById(
            "target-lang-full-text-content"
          ).innerText;
          togglePlayStop(playTargetBtn, true);
          speakText(text, selectedTargetLang, soundwaveTarget, function () {
            togglePlayStop(playTargetBtn, false);
          });
        };

        vocabList.innerHTML = "";
        learnedWords.forEach((word, idx) => {
          const item = document.createElement("div");
          item.className =
            "flex justify-between items-center bg-slate-700/50 p-3 rounded-md";

          //TODO: svg in project folder. no internet needed
          item.innerHTML = `
            <span class="font-medium text-blue-300 flex items-center">
              ${word.target}
              <button title="Play" class="ml-2 px-1 py-0.5 rounded bg-blue-600 hover:bg-blue-700 text-white play-vocab flex items-center" data-idx="${idx}">
                <svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' viewBox='0 0 24 24'><path fill='currentColor' d='M8 5v14l11-7z'/></svg>
                <span class="soundwave" style="display:none"><svg width="22" height="18" viewBox="0 0 22 18"><rect x="1" width="3" height="6" y="12"/><rect x="6" width="3" height="6" y="12"/><rect x="11" width="3" height="6" y="12"/><rect x="16" width="3" height="6" y="12"/></svg></span>
              </button>
            </span>
            <span class="text-slate-400">${word.native}</span>
          `;
          vocabList.appendChild(item);
        });

        // Add event listeners for vocab playback
        vocabList.querySelectorAll(".play-vocab").forEach((btn) => {
          const soundwave = btn.querySelector(".soundwave");
          btn.onclick = function () {
            const idx = btn.getAttribute("data-idx");
            const word = learnedWords[idx].target;
            togglePlayStop(btn, true);
            speakText(word, selectedTargetLang, soundwave, function () {
              togglePlayStop(btn, false);
            });
          };
        });
        // --- WEB SPEECH API ---
        function speakText(text, lang, soundwaveEl, onDone) {
          if (!window.speechSynthesis) return;
          const utter = new window.SpeechSynthesisUtterance(text);
          utter.lang = lang;
          window.speechSynthesis.cancel(); // Stop any current speech
          if (soundwaveEl) soundwaveEl.style.display = "inline-block";
          utter.onend = utter.onerror = function () {
            if (soundwaveEl) soundwaveEl.style.display = "none";
            if (typeof onDone === "function") onDone();
          };
          window.speechSynthesis.speak(utter);
        }

        // Toggle play/stop icon for button
        function togglePlayStop(btn, isPlaying) {
          const svg = btn.querySelector("svg");
          if (!svg) return;
          if (isPlaying) {
            // Change to stop icon
            svg.innerHTML =
              '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>';
          } else {
            // Change to play icon
            svg.innerHTML = '<path fill="currentColor" d="M8 5v14l11-7z"/>';
          }
        }
      }

      function initializeApp() {
        // New languageDisplayNames object to hold translated language names
        // This object now holds the *display names* of the languages themselves,
        // translated into each UI language.
        // This was moved outside initializeApp to be a global const.

        // Populate UI language select first
        populateSelect(uiLangSelect, languageDisplayNames, "en"); // Default UI to English

        // Add event listener for UI language change
        uiLangSelect.addEventListener("change", () =>
          updateUIText(uiLangSelect.value)
        );

        // Populate other selects (topic names will now use the selected UI language)
        populateSelect(topicSelect, topicNames, "booking_flight");
        populateSelect(nativeLangSelect, languageDisplayNames, "en");
        populateSelect(targetLangSelect, languageDisplayNames, "de");

        // Add event listeners for topic, native, and target language changes
        topicSelect.addEventListener("change", generateText);
        nativeLangSelect.addEventListener("change", generateText);
        targetLangSelect.addEventListener("change", generateText);

        // Initial generation and UI text update
        updateUIText(uiLangSelect.value); // Apply initial UI language
        generateText(); // Generate content based on initial selections
      }

      document.addEventListener("DOMContentLoaded", function () {
        initializeApp();
        // Hide/show menu logic
        const controlsCard = document.getElementById("controls-card");
        const toggleMenuBtn = document.getElementById("toggle-menu-btn");
        let menuVisible = true;
        toggleMenuBtn.onclick = function () {
          menuVisible = !menuVisible;
          controlsCard.style.display = menuVisible ? "" : "none";
          toggleMenuBtn.textContent = menuVisible ? "᎒" : "᎒";
        };
      });
    </script>
