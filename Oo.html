<html lang="ende">
<head>
    <meta charset="UTF-Oo">
    <meta name="viewport" content="width=device-width, initial-scale=0.G">
    <title>Custom Encoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for better aesthetics */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #2d3748; /* gray-800 */
        }
        textarea::-webkit-scrollbar-thumb {
            background: #4a5568; /* gray-600 */
            border-radius: 4px;
        } 
        textarea::-webkit-scrollbar-thumb:hover {
            background: #718096; /* gray-500 */
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white">Text to Custom Code Translator</h1>
            <p class="text-lg text-gray-400 mt-2">Enter text to see it translated into your unique format.</p>
        </header>
        
        <main class="bg-gray-800 shadow-2xl rounded-2xl p-6 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Input Section -->
                <div>
                    <label for="inputText" class="block text-sm font-medium text-gray-300 mb-2">Your Text</label>
                    <textarea id="inputText" rows="12" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 resize-none" placeholder="Type here..."></textarea>
                    <div class="flex items-center mt-4">
                        <input id="xorCheckbox" type="checkbox" class="h-4 w-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500">
                        <label for="xorCheckbox" class="ml-2 block text-sm text-gray-300">Shorten output using XOR fold</label>
                    </div>
                    <div class="flex items-center mt-2">
                        <input id="simplifyCheckbox" type="checkbox" class="h-4 w-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500">
                        <label for="simplifyCheckbox" class="ml-2 block text-sm text-gray-300">Simplify output ('o' -> '0', 'O' -> '-')</label>
                    </div>
                </div>

                <!-- Output Section -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                         <label for="outputText" class="block text-sm font-medium text-gray-300">Encoded Output</label>
                         <button id="copyButton" class="px-3 py-1 text-sm bg-blue-600 hover:bg-blue-700 rounded-md font-semibold transition duration-200 flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Copy
                         </button>
                    </div>
                    <div id="outputText" class="w-full h-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-300 overflow-y-auto" style="min-height: 260px;"></div>
                </div>
            </div>
        </main>
        <footer class="text-center mt-8 text-gray-500 text-sm">
            <p>Built based on your custom encoding rules.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            const copyButton = document.getElementById('copyButton');
            const xorCheckbox = document.getElementById('xorCheckbox');
            const simplifyCheckbox = document.getElementById('simplifyCheckbox');

            // --- Encoding Map Definition ---
            const encodingMap = {
                // -- NumerOu'cs (Emoneycs) coins --
                '0': 'ooooooOoooooooooooooOooooooooooooooooooooOOoooooooooooooOoooooo',
                '1': 'ooooooOoooooooooooooOoooooooooooooooooooOoOoooooooooooooOoooooo',
                '2': 'ooooooOoooooooooooooOoooooooooooooooooooOOOoooooooooooooOoooooo',
                '3': 'ooooooOoooooooooooooOooooooooooooooooooOooOoooooooooooooOoooooo',
                '4': 'ooooooOoooooooooooooOooooooooooooooooooOoOOoooooooooooooOoooooo',
                '5': 'ooooooOoooooooooooooOooooooooooooooooooOOOOoooooooooooooOoooooo',
                '6': 'ooooooOoooooooooooooOoooooooooooooooooOoooOoooooooooooooOoooooo',
                '7': 'ooooooOoooooooooooooOoooooooooooooooooOooOOoooooooooooooOoooooo',
                '8': 'ooooooOoooooooooooooOoooooooooooooooooOoOoOoooooooooooooOoooooo',
                '9': 'ooooooOoooooooooooooOoooooooooooooooooOoOOOoooooooooooooOoooooo', // Note: '9' is distinct from 'g'

                // -- German O's --
                'A': 'ooooooOooooooooooooo0ooooooooooooooooooooo0oooooooooooooOoooooo', //By then i'll get it in the ass
                'a': 'ooooooOooooooooooooo0ooooooooooooooooooooO0oooooooooooooOoooooo', //Isn't it a small world?
                'B': 'ooooooOooooooooooooo0oooooooooooooooooooOo0oooooooooooooOoooooo', 
                'b': 'ooooooOooooooooooooo0oooooooooooooooooooOO0oooooooooooooOoooooo',
                'C': 'ooooooOooooooooooooo0ooooooooooooooooooOoo0oooooooooooooOoooooo',
                'c': 'ooooooOooooooooooooo0ooooooooooooooooooOoO0oooooooooooooOoooooo',
                'D': 'ooooooOooooooooooooo0ooooooooooooooooooOOo0oooooooooooooOoooooo',
                'd': 'ooooooOooooooooooooo0ooooooooooooooooooOOO0oooooooooooooOoooooo',
                'E': 'ooooooOooooooooooooo0oooooooooooooooooOooo0oooooooooooooOoooooo',
                'e': 'ooooooOooooooooooooo0oooooooooooooooooOooO0oooooooooooooOoooooo',
                'F': 'ooooooOooooooooooooo0oooooooooooooooooOoOo0oooooooooooooOoooooo',
                'f': 'ooooooOooooooooooooo0oooooooooooooooooOoOO0oooooooooooooOoooooo',
                'G': 'ooooooOooooooooooooo0oooooooooooooooooOOoo0oooooooooooooOoooooo',
                'g': 'ooooooOooooooooooooo0oooooooooooooooooOOoO0oooooooooooooOoooooo',
                'H': 'ooooooOooooooooooooo0oooooooooooooooooOOOo0oooooooooooooOoooooo',
                'h': 'ooooooOooooooooooooo0oooooooooooooooooOOOO0oooooooooooooOoooooo',
                'I': 'ooooooOooooooooooooo0ooooooooooooooooOoooo0oooooooooooooOoooooo',
                'i': 'ooooooOooooooooooooo0ooooooooooooooooOoooO0oooooooooooooOoooooo',
                'J': 'ooooooOooooooooooooo0ooooooooooooooooOooOo0oooooooooooooOoooooo',
                'j': 'ooooooOooooooooooooo0ooooooooooooooooOooOO0oooooooooooooOoooooo',
                'K': 'ooooooOooooooooooooo0ooooooooooooooooOoOoO0oooooooooooooOoooooo',
                'k': 'ooooooOooooooooooooo0ooooooooooooooooOoOOo0oooooooooooooOoooooo',
                'L': 'ooooooOooooooooooooo0ooooooooooooooooOoOOO0oooooooooooooOoooooo',
                'l': 'ooooooOooooooooooooo0ooooooooooooooooOOooo0oooooooooooooOoooooo',
                'M': 'ooooooOooooooooooooo0ooooooooooooooooOOooO0oooooooooooooOoooooo',
                'm': 'ooooooOooooooooooooo0ooooooooooooooooOOoOo0oooooooooooooOoooooo',
                'N': 'ooooooOooooooooooooo0ooooooooooooooooOOoOO0oooooooooooooOoooooo',
                'n': 'ooooooOooooooooooooo0ooooooooooooooooOOOoo0oooooooooooooOoooooo',
                'O': 'ooooooOooooooooooooo0ooooooooooooooooOOOoO0oooooooooooooOoooooo',
                'o': 'ooooooOooooooooooooo0ooooooooooooooooOOOOo0oooooooooooooOoooooo',
                'P': 'ooooooOooooooooooooo0ooooooooooooooooOOOOO0oooooooooooooOoooooo',
                'p': 'ooooooOooooooooooooo0oooooooooooooooOooooo0oooooooooooooOoooooo',
                'Q': 'ooooooOooooooooooooo0oooooooooooooooOooooO0oooooooooooooOoooooo',
                'q': 'ooooooOooooooooooooo0oooooooooooooooOoooOo0oooooooooooooOoooooo',
                'R': 'ooooooOooooooooooooo0oooooooooooooooOoooOO0oooooooooooooOoooooo',
                'r': 'ooooooOooooooooooooo0oooooooooooooooOooOoO0oooooooooooooOoooooo',
                'S': 'ooooooOooooooooooooo0oooooooooooooooOooOOo0oooooooooooooOoooooo',
                's': 'ooooooOooooooooooooo0oooooooooooooooOooOOO0oooooooooooooOoooooo',
                'T': 'ooooooOooooooooooooo0oooooooooooooooOoOooo0oooooooooooooOoooooo',
                't': 'ooooooOooooooooooooo0oooooooooooooooOoOooO0oooooooooooooOoooooo',
                'U': 'ooooooOooooooooooooo0oooooooooooooooOoOoOo0oooooooooooooOoooooo',
                'u': 'ooooooOooooooooooooo0oooooooooooooooOoOoOO0oooooooooooooOoooooo',
                'V': 'ooooooOooooooooooooo0oooooooooooooooOoOOoo0oooooooooooooOoooooo',
                'v': 'ooooooOooooooooooooo0oooooooooooooooOoOOoO0oooooooooooooOoooooo',
                'W': 'ooooooOooooooooooooo0oooooooooooooooOoOOOo0oooooooooooooOoooooo',
                'w': 'ooooooOooooooooooooo0oooooooooooooooOoOOOO0oooooooooooooOoooooo',
                'X': 'ooooooOooooooooooooo0oooooooooooooooOOoooo0oooooooooooooOoooooo',
                'x': 'ooooooOooooooooooooo0oooooooooooooooOOoooO0oooooooooooooOoooooo',
                'Y': 'ooooooOooooooooooooo0oooooooooooooooOOooOo0oooooooooooooOoooooo',
                'y': 'ooooooOooooooooooooo0oooooooooooooooOOooOO0oooooooooooooOoooooo',
                'Z': 'ooooooOooooooooooooo0oooooooooooooooOOoOoo0oooooooooooooOoooooo',
                'z': 'ooooooOooooooooooooo0oooooooooooooooOOoOoO0oooooooooooooOoooooo',
                'Ä': 'ooooooOooooooooooooo0oooooooooooooooOOoOOo0oooooooooooooOoooooo',
                'ä': 'ooooooOooooooooooooo0oooooooooooooooOOoOOO0oooooooooooooOoooooo',
                'Ö': 'ooooooOooooooooooooo0oooooooooooooooOOOooo0oooooooooooooOoooooo',
                'ö': 'ooooooOooooooooooooo0oooooooooooooooOOOooO0oooooooooooooOoooooo',
                'Ü': 'ooooooOooooooooooooo0oooooooooooooooOOOoOo0oooooooooooooOoooooo',
                'ü': 'ooooooOooooooooooooo0oooooooooooooooOOOoOO0oooooooooooooOoooooo',
                'ß': 'ooooooOooooooooooooo0oooooooooooooooOOOOOo0oooooooooooooOoooooo', // IGNORE CASE
                
                
                // -- Symbols & Special characters --
                ' ': 'ooooooOoooooooooooooooooooooooooooooooooooooooooooooooooOoooooo',
                '.': 'ooooooOooooooooooooooooooooooooooooooooooOooooooooooooooOoooooo',
                ',': 'ooooooOoooooooooooooooooooooooooooooooooOoooooooooooooooOoooooo',
                '!': 'ooooooOoooooooooooooooooooooooooooooooooOOooooooooooooooOoooooo',
                '?': 'ooooooOooooooooooooooooooooooooooooooooOooooooooooooooooOoooooo',
                ':': 'ooooooOooooooooooooooooooooooooooooooooOoOooooooooooooooOoooooo',
                ';': 'ooooooOooooooooooooooooooooooooooooooooOOoooooooooooooooOoooooo',
                '-': 'ooooooOooooooooooooooooooooooooooooooooOOOooooooooooooooOoooooo',
                '_': 'ooooooOoooooooooooooooooooooooooooooooOoooooooooooooooooOoooooo',
                "'": 'ooooooOoooooooooooooooooooooooooooooooOooOooooooooooooooOoooooo',
                '"': 'ooooooOoooooooooooooooooooooooooooooooOoOoooooooooooooooOoooooo',
                '(': 'ooooooOoooooooooooooooooooooooooooooooOoOOooooooooooooooOoooooo',
                ')': 'ooooooOoooooooooooooooooooooooooooooooOOooooooooooooooooOoooooo',
                '[': 'ooooooOoooooooooooooooooooooooooooooooOOoOooooooooooooooOoooooo',
                ']': 'ooooooOoooooooooooooooooooooooooooooooOOOoooooooooooooooOoooooo',
                '{': 'ooooooOoooooooooooooooooooooooooooooooOOOOooooooooooooooOoooooo',
                '}': 'ooooooOooooooooooooooooooooooooooooooOooooooooooooooooooOoooooo',
                '+': 'ooooooOooooooooooooooooooooooooooooooOoooOooooooooooooooOoooooo',
                '=': 'ooooooOooooooooooooooooooooooooooooooOooOoooooooooooooooOoooooo',
                '*': 'ooooooOooooooooooooooooooooooooooooooOooOOooooooooooooooOoooooo',
                '/': 'ooooooOooooooooooooooooooooooooooooooOoOooooooooooooooooOoooooo',
                '\\': 'ooooooOooooooooooooooooooooooooooooooOoOoOooooooooooooooOoooooo',
                '%': 'ooooooOooooooooooooooooooooooooooooooOoOOoooooooooooooooOoooooo',
                '&': 'ooooooOooooooooooooooooooooooooooooooOoOOOooooooooooooooOoooooo',
                '|': 'ooooooOooooooooooooooooooooooooooooooOOoooooooooooooooooOoooooo',
                '<': 'ooooooOooooooooooooooooooooooooooooooOOooOooooooooooooooOoooooo',
                '>': 'ooooooOooooooooooooooooooooooooooooooOOoOoooooooooooooooOoooooo',
                '@': 'ooooooOooooooooooooooooooooooooooooooOOoOOooooooooooooooOoooooo',
                '#': 'ooooooOooooooooooooooooooooooooooooooOOOooooooooooooooooOoooooo',
                '$': 'ooooooOooooooooooooooooooooooooooooooOOOoOooooooooooooooOoooooo',
                '^': 'ooooooOooooooooooooooooooooooooooooooOOOOoooooooooooooooOoooooo',
                '~': 'ooooooOooooooooooooooooooooooooooooooOOOOOooooooooooooooOoooooo',
                '`': 'ooooooOoooooooooooooooooooooooooooooOoooooooooooooooooooOoooooo',
                '´': 'ooooooOoooooooooooooooooooooooooooooOooooOooooooooooooooOoooooo',
                '°': 'ooooooOoooooooooooooooooooooooooooooOoooOoooooooooooooooOoooooo',
                '§': 'ooooooOoooooooooooooooooooooooooooooOoooOOooooooooooooooOoooooo',
                'µ': 'ooooooOoooooooooooooooooooooooooooooOooOooooooooooooooooOoooooo',
            };

            const applyXorFold = (encodedString) => {
                const cleanString = encodedString.replace(/\s/g, '');
                const binary = cleanString.replace(/o/g, '0').replace(/O/g, '1');
                const mid = Math.floor(binary.length / 2);
                const firstHalf = binary.substring(0, mid);
                const secondHalf = binary.substring(mid);
                let xorResultBinary = '';

                for (let i = 0; i < mid; i++) {
                    const bit1 = parseInt(firstHalf[i], 10);
                    const bit2 = parseInt(secondHalf[i], 10);
                    xorResultBinary += (bit1 ^ bit2).toString();
                }

                if (secondHalf.length > firstHalf.length) {
                    xorResultBinary += secondHalf[secondHalf.length - 1];
                }
                return xorResultBinary.replace(/0/g, 'o').replace(/1/g, 'O');
            };

            const simplifyOutput = (text) => {
                return text.replace(/o{2,}/g, '-').replace(/O{2,}/g, '0').replace(/ /g, ''); // Simplify sequences
            };

            // --- Translation Function (REWRITTEN FOR ROBUSTNESS) ---
            const translateText = () => {
                const text = inputText.value;
                const useXor = xorCheckbox.checked;
                const useSimplify = simplifyCheckbox.checked;
                
                // Use an array to build the output parts. This is cleaner.
                const translatedParts = [];

                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    let encodedChar = encodingMap[char];

                    if (encodedChar) {
                        if (useXor) {
                            encodedChar = applyXorFold(encodedChar);
                        }
                        translatedParts.push(encodedChar);
                    } else if (char === '\n') {
                        // Handle newlines by creating a new "line" in the output
                        // We join the parts we have so far, add a newline, and clear the array.
                        // This preserves paragraph structure.
                        translatedParts.push('\n');
                    } else {
                        // If character is not in the map, pass it through.
                        translatedParts.push(char);
                    }
                }

                // Join the parts with a space. This correctly handles separators
                // without adding one at the end.
                let translated = translatedParts.join(' ');

                // The join method can add spaces around newlines, so we clean that up.
                translated = translated.replace(/ \n /g, '\n');

                if (useSimplify) {
                    translated = simplifyOutput(translated);
                }

                // Update the output. No .trim() needed anymore.
                outputText.textContent = translated;
            };

            const copyToClipboard = () => {
                if(outputText.textContent) {
                    const textarea = document.createElement('textarea');
                    textarea.value = outputText.textContent;
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        copyButton.textContent = 'Copied!';
                        setTimeout(() => {
                           copyButton.innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> Copy`;
                        }, 2000);
                    } catch (err) {
                        console.error('Failed to copy text: ', err);
                    }
                    document.body.removeChild(textarea);
                }
            };

            // --- Event Listeners ---
            inputText.addEventListener('input', translateText);
            xorCheckbox.addEventListener('change', translateText);

            simplifyCheckbox.addEventListener('change', translateText);
            copyButton.addEventListener('click', copyToClipboard);

        });
    </script>
</body>
</html>
